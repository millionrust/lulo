[package]
name = "rmac-finder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
links = "rmac_finder_resource"

[[bin]]
name = "rmac-files"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
async-io.workspace = true
blocking.workspace = true
gpui.workspace = true
gpui_linux.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rmac-app-launch.workspace = true
rmac-apps.workspace = true
rmac-archive.workspace = true
rmac-appearance.workspace = true
rmac-locale.workspace = true
rmac-mounts.workspace = true
rmac-pasteboard.workspace = true
rmac-quick-look.workspace = true
rmac-ui.workspace = true
rmac-search.workspace = true
rmac-shell-settings.workspace = true
rmac-storage.workspace = true
rmac-sound.workspace = true
rmac-thumbnails.workspace = true
chrono.workspace = true
libc.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
trash.workspace = true
notify.workspace = true
rustix.workspace = true
uuid.workspace = true

# The Dock (rmac-dock-system pulls in rmac-compositor-niri, which is
# Linux-only). "Add to Dock" is a Windows honest stub until phase 3's Dock
# exists there (ADR 0023).
[target.'cfg(target_os = "linux")'.dependencies]
rmac-dock.workspace = true
rmac-dock-system.workspace = true

# Real folders/drives (SHGetKnownFolderPath, GetLogicalDrives), opening with
# the default app, the Recycle Bin, and the operation journal's no-replace
# rename and free-space checks (ADR 0023 phase 4).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

# The exe's version info and icon (ADR 0023 "Installer"); see build.rs.
[target.'cfg(windows)'.build-dependencies]
rmac-windows-resource-build.workspace = true
