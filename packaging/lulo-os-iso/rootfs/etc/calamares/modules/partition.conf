# Lulo OS partitioning (ADR 0029): Erase disk, Install alongside (shrinks
# an existing partition with KPMcore; ntfsresize refuses a hibernated or
# dirty Windows volume), Replace a partition, or Manual.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - file
initialSwapChoice: file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2
showNotEncryptedBootMessage: false

# With encryption, GRUB reads an unencrypted /boot (as Lubuntu 26.04 does).
partitionLayout:
    - name: "lulo_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 2G
    - name: "lulo_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
