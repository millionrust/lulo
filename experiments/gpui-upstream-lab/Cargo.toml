[package]
name = "rmac-gpui-upstream-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
async-channel = "2"
blocking = "1"
chrono = "0.4"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "76c93968da5b8b8809bdd72e4ad9e7d0e946bad0", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "76c93968da5b8b8809bdd72e4ad9e7d0e946bad0", package = "gpui_platform", features = ["font-kit"] }
rmac-apps = { path = "../../crates/rmac-apps" }
rmac-compositor = { path = "../../crates/rmac-compositor" }
rmac-compositor-niri = { path = "../../crates/rmac-compositor-niri" }
rmac-dock = { path = "../../crates/rmac-dock" }
rmac-places = { path = "../../crates/rmac-places" }
rmac-places-system = { path = "../../crates/rmac-places-system" }
rmac-shell-runtime = { path = "../../crates/rmac-shell-runtime" }
rmac-shell-settings = { path = "../../crates/rmac-shell-settings" }
rmac-shell-status = { path = "../../crates/rmac-shell-status" }
rmac-wallpaper = { path = "../../crates/rmac-wallpaper" }
uuid = { version = "1", features = ["v5"] }

[[bin]]
name = "a11y"
path = "src/bin/a11y.rs"

[[bin]]
name = "layer-shell"
path = "src/bin/layer_shell.rs"

[[bin]]
name = "top-bar"
path = "src/bin/top_bar.rs"

[[bin]]
name = "wallpaper"
path = "src/bin/wallpaper.rs"

[[bin]]
name = "dock"
path = "src/bin/dock.rs"
