# Lulo OS: one administrator account, signed in with a password like a Mac.
---
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - sudo
    - name: lpadmin
      must_exist: false
      system: true
    - name: sambashare
      must_exist: false
      system: true
sudoersGroup: sudo
setRootPassword: false
doAutologin: false

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, lulo-live, gdm, nobody, polkitd ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-${product}"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
