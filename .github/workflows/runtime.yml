name: Lulo runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build all app and shell binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang libfontconfig1-dev libfreetype-dev libpam0g-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            shell/target
          key: ${{ runner.os }}-runtime-${{ hashFiles('Cargo.lock', 'shell/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build and stage binaries
        run: |
          cargo build --locked --workspace --bins
          (cd shell && cargo build --locked --workspace --bins --features wayland)
          python3 scripts/behavior/runtime_ci.py stage target/debug shell/target/debug runtime-bin
          strip --strip-unneeded runtime-bin/*
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-binaries
          path: runtime-bin/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3

  scenarios:
    name: Scenarios ${{ matrix.shard }}/8
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-binaries
          path: runtime-bin
      - name: Install private Wayland runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core dbus grim libglib2.0-bin mesa-vulkan-drivers \
            poppler-utils python3-pyatspi sway wl-clipboard xdg-desktop-portal
      - name: Play recorded scenarios
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          chmod +x runtime-bin/*
          python3 scripts/behavior/runtime_ci.py prepare runtime-bin
          result="$RUNNER_TEMP/runtime-results/scenario-$SHARD"
          mkdir -p "$result/screenshots"
          set +e
          /usr/bin/python3 scripts/behavior/run_lulo.py \
            --bin-dir runtime-bin --shard "$SHARD/8" \
            --capture-dir "$result/screenshots" \
            --output "$result/behavior-results.json" > "$result/runner.log" 2>&1
          status=$?
          set -e
          cat "$result/runner.log"
          printf '{"exit_code":%s}\n' "$status" > "$result/status.json"
      - name: Upload scenario results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-scenario-${{ matrix.shard }}
          path: ${{ runner.temp }}/runtime-results/
          if-no-files-found: error
          retention-days: 7

  checks:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        suite: [menu-dismiss, power-dialogs, window-move, 01-files, 02-text-editor, 03-settings, 04-calculator, 05-preview, 06-notes, 07-terminal, 08-shell, 09-menu-bar, 10-spotlight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-binaries
          path: runtime-bin
      - name: Install private Wayland runtime and pinned niri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core curl dbus foot gir1.2-gtk-4.0 grim libdisplay-info3 \
            libgbm1 libglib2.0-bin libinput10 libpango-1.0-0 \
            libpangocairo-1.0-0 libpipewire-0.3-0t64 libseat1 \
            mesa-vulkan-drivers python3-dbus python3-gi python3-pil \
            python3-pyatspi sway xdg-desktop-portal
          curl --fail --silent --show-error --location --retry 3 \
            https://ppa.launchpadcontent.net/avengemedia/danklinux/ubuntu/pool/main/n/niri/niri_26.04ppa3_amd64.deb \
            --output "$RUNNER_TEMP/niri.deb"
          printf '%s  %s\n' \
            f44c5b1c9cb8838c538618caccbbed5a5173ba04569983beae61c59ec0e38cb0 \
            "$RUNNER_TEMP/niri.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/niri.deb" "$RUNNER_TEMP/niri-package"
          ldd "$RUNNER_TEMP/niri-package/usr/bin/niri" | tee "$RUNNER_TEMP/niri-libs.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/niri-libs.txt"
          test ! -e /usr/bin/orca
      - name: Run private nested compositor check
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          chmod +x runtime-bin/*
          python3 scripts/behavior/runtime_ci.py prepare runtime-bin
          result="$RUNNER_TEMP/runtime-results/$SUITE"
          niri="$RUNNER_TEMP/niri-package/usr/bin/niri"
          mkdir -p "$result"
          set +e
          case "$SUITE" in
            menu-dismiss) /usr/bin/python3 scripts/behavior/run_menu_dismiss.py --niri "$niri" --bin-dir runtime-bin ;;
            power-dialogs) /usr/bin/python3 scripts/behavior/run_power_dialogs.py --niri "$niri" --bin-dir runtime-bin --capture-dir "$result/screenshots" ;;
            window-move) /usr/bin/python3 scripts/behavior/run_window_move.py --niri "$niri" --bin-dir runtime-bin ;;
            *) /usr/bin/python3 scripts/parallel/run_lulo_journey.py --niri "$niri" --bin-dir runtime-bin --output "$result/screenshots" "$SUITE" ;;
          esac > "$result/runner.log" 2>&1
          status=$?
          set -e
          cat "$result/runner.log"
          printf '{"exit_code":%s}\n' "$status" > "$result/status.json"
      - name: Upload check results and Lulo screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-${{ matrix.suite }}
          path: ${{ runner.temp }}/runtime-results/
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Runtime summary (non-blocking)
    if: always()
    needs: [build, scenarios, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: lulo-runtime-*
          path: runtime-downloads
          merge-multiple: true
      - name: Merge and gate results
        run: |
          set +e
          python3 scripts/behavior/runtime_ci.py summarize runtime-downloads runtime-summary.md
          status=$?
          set -e
          cat runtime-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload merged summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-summary
          path: runtime-summary.md
          if-no-files-found: warn
          retention-days: 7
