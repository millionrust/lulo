# Lulo OS live medium boot menu (ADR 0029). Shared by the signed UEFI GRUB
# and the BIOS El Torito GRUB.
set default=0
set timeout=5
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod part_gpt
insmod part_msdos
insmod iso9660
if loadfont /boot/grub/themes/lulo/lulo-16.pf2; then
    loadfont /boot/grub/themes/lulo/lulo-24.pf2
    set gfxmode=auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/lulo/theme.txt
fi

menuentry "Try or Install Lulo OS @VERSION@" --class lulo {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}
menuentry "Lulo OS (safe graphics)" --class lulo {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Boot from the next disk (Windows)" {
        exit 1
    }
    menuentry "UEFI firmware settings" {
        fwsetup
    }
fi
