[workspace]
resolver = "2"
members = ["crates/*", "bins/*", "probes/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
async-channel = "2"
async-io = "2"
blocking = "1"
chrono = "0.4"
futures-util = "0.3"
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "76c93968da5b8b8809bdd72e4ad9e7d0e946bad0", package = "gpui" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed.git", rev = "76c93968da5b8b8809bdd72e4ad9e7d0e946bad0", package = "gpui_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false }
rmac-apps = { version = "=0.1.0", path = "../crates/rmac-apps" }
rmac-app-launch = { version = "=0.1.0", path = "../crates/rmac-app-launch" }
rmac-app-menu = { version = "=0.1.0", path = "../crates/rmac-app-menu" }
rmac-appearance = { version = "=0.1.0", path = "../crates/rmac-appearance" }
rmac-appearance-portal = { version = "=0.1.0", path = "../crates/rmac-appearance-portal" }
rmac-compositor = { version = "=0.1.0", path = "../crates/rmac-compositor" }
rmac-compositor-niri = { version = "=0.1.0", path = "../crates/rmac-compositor-niri" }
rmac-design = { version = "=0.1.0", path = "../crates/rmac-design" }
rmac-desktop = { version = "=0.1.0", path = "../crates/rmac-desktop" }
rmac-dock = { version = "=0.1.0", path = "../crates/rmac-dock" }
rmac-dock-runtime = { version = "=0.1.0", path = "../crates/rmac-dock-runtime" }
rmac-dock-system = { version = "=0.1.0", path = "../crates/rmac-dock-system" }
rmac-places = { version = "=0.1.0", path = "../crates/rmac-places" }
rmac-recent-documents = { version = "=0.1.0", path = "../crates/rmac-recent-documents" }
rmac-search = { version = "=0.1.0", path = "../crates/rmac-search" }
rmac-osd = { version = "=0.1.0", path = "../crates/rmac-osd" }
rmac-shell-layer = { version = "=0.1.0", path = "crates/rmac-shell-layer" }
rmac-shell-runtime = { version = "=0.1.0", path = "../crates/rmac-shell-runtime" }
rmac-shell-settings = { version = "=0.1.0", path = "../crates/rmac-shell-settings" }
rmac-shell-status = { version = "=0.1.0", path = "../crates/rmac-shell-status" }
rmac-sound = { version = "=0.1.0", path = "../crates/rmac-sound" }
rmac-shell-ui = { version = "=0.1.0", path = "crates/rmac-shell-ui" }
rmac-theme = { version = "=0.1.0", path = "../crates/rmac-theme" }
rmac-wallpaper = { version = "=0.1.0", path = "../crates/rmac-wallpaper" }
rmac-wallpaper-image = { version = "=0.1.0", path = "../crates/rmac-wallpaper-image" }
rmac-wallpaper-runtime = { version = "=0.1.0", path = "../crates/rmac-wallpaper-runtime" }
trash = "5"
uuid = { version = "1", features = ["v5"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Optimised but quick to relink, for trying changes on the reference PC:
# `cargo build --profile iterate`. Release keeps fat LTO for shipping.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[patch."https://github.com/zed-industries/zed.git"]
ztracing = { path = "compat/ztracing" }
