[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["experiments/gpui-upstream-lab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rmac"]

# A fast, macOS-feel desktop suite built in Rust on GPUI, targeting Ubuntu/Wayland.
# Developed on macOS (Metal) today; Linux (Vulkan) is the deployment target.

[workspace.dependencies]
ashpd = "0.12.3"
async-channel = "2"
async-io = "2"
async-process = "2"
blocking = "1"
chrono = "0.4"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
futures-util = { version = "0.3", features = ["io"] }
futures-lite = "2"
image = "0.25.10"
kdl = { version = "=6.5.0", features = ["v1-fallback"] }
notify = "7"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
rmac-apps = { version = "=0.1.0", path = "crates/rmac-apps" }
rmac-appearance = { version = "=0.1.0", path = "crates/rmac-appearance" }
rmac-appearance-portal = { version = "=0.1.0", path = "crates/rmac-appearance-portal" }
rmac-bluetooth = { version = "=0.1.0", path = "crates/rmac-bluetooth" }
rmac-compositor = { version = "=0.1.0", path = "crates/rmac-compositor" }
rmac-compositor-niri = { version = "=0.1.0", path = "crates/rmac-compositor-niri" }
rmac-editor = { version = "=0.1.0", path = "crates/rmac-editor" }
rmac-mounts = { version = "=0.1.0", path = "crates/rmac-mounts" }
rmac-network = { version = "=0.1.0", path = "crates/rmac-network" }
rmac-audio = { version = "=0.1.0", path = "crates/rmac-audio" }
rmac-display = { version = "=0.1.0", path = "crates/rmac-display" }
rmac-dock = { version = "=0.1.0", path = "crates/rmac-dock" }
rmac-dock-system = { version = "=0.1.0", path = "crates/rmac-dock-system" }
rmac-dock-runtime = { version = "=0.1.0", path = "crates/rmac-dock-runtime" }
rmac-input = { version = "=0.1.0", path = "crates/rmac-input" }
rmac-launcher = { version = "=0.1.0", path = "crates/rmac-launcher" }
rmac-launcher-providers = { version = "=0.1.0", path = "crates/rmac-launcher-providers" }
rmac-launcher-runtime = { version = "=0.1.0", path = "crates/rmac-launcher-runtime" }
rmac-launcher-system = { version = "=0.1.0", path = "crates/rmac-launcher-system" }
rmac-power = { version = "=0.1.0", path = "crates/rmac-power" }
rmac-quick-settings = { version = "=0.1.0", path = "crates/rmac-quick-settings" }
rmac-quick-settings-system = { version = "=0.1.0", path = "crates/rmac-quick-settings-system" }
rmac-portal = { version = "=0.1.0", path = "crates/rmac-portal" }
rmac-places = { version = "=0.1.0", path = "crates/rmac-places" }
rmac-places-system = { version = "=0.1.0", path = "crates/rmac-places-system" }
rmac-search = { version = "=0.1.0", path = "crates/rmac-search" }
rmac-session = { version = "=0.1.0", path = "crates/rmac-session" }
rmac-shell-settings = { version = "=0.1.0", path = "crates/rmac-shell-settings" }
rmac-shell-status = { version = "=0.1.0", path = "crates/rmac-shell-status" }
rmac-shell-status-linux = { version = "=0.1.0", path = "crates/rmac-shell-status-linux" }
rmac-shell-runtime = { version = "=0.1.0", path = "crates/rmac-shell-runtime" }
rmac-shortcuts = { version = "=0.1.0", path = "crates/rmac-shortcuts" }
rmac-storage = { version = "=0.1.0", path = "crates/rmac-storage" }
rmac-thumbnails = { version = "=0.1.0", path = "crates/rmac-thumbnails" }
rmac-theme = { version = "=0.1.0", path = "crates/rmac-theme" }
rmac-ui = { version = "=0.1.0", path = "crates/rmac-ui" }
rmac-wallpaper = { version = "=0.1.0", path = "crates/rmac-wallpaper" }
rmac-wallpaper-system = { version = "=0.1.0", path = "crates/rmac-wallpaper-system" }
quick-xml = "0.39.4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
trash = "5"
url = "2"
walkdir = "2"
zbus = { version = "5.16.0", features = ["blocking-api"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
