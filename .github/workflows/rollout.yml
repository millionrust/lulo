# Step, halt, or refresh the live APT repository.
#
# On a schedule this re-signs the repository before its Valid-Until lapses
# (APT refuses expired metadata; update-trust.md caps validity at 48 hours)
# and steps the phase forward -- 10 -> 25 -> 50 -> 100 -- only after at least
# 24 hours in the current phase (docs/update-trust.md "Staged rollout and
# rollback"); it never resumes a halted (0%) rollout on its own. A manual run
# can request any percentage, including 0 to halt immediately. See
# docs/release-process.md for how to use this by hand.
#
# A rollout never rebuilds or adds packages: scripts/linux/apt-publication.py
# rebuilds the published repository from GitHub Releases, and
# stage-apt-snapshot.py --rollout-only refuses any pool object that is not
# already published, so this job can only change phasing, Date, and
# Valid-Until. That is why it signs through the "apt-refresh" environment,
# which (unlike release.yml's "apt-signing") has no required reviewer: the
# repository must be re-signed at least every 48 hours without a human.
# Restrict "apt-refresh" to the default branch (docs/release-process.md).
name: Rollout

on:
  schedule:
    # Every 6 hours; apt-publication.py decides whether a phase step or a
    # signature refresh is due, so a tick with nothing to do is a cheap
    # no-op rather than something this expression has to get exactly right.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phased-Update-Percentage to publish now (0 halts the rollout)"
        required: true
        type: choice
        options:
          - "0"
          - "10"
          - "25"
          - "50"
          - "100"

permissions:
  contents: read

jobs:
  rollout:
    name: Step or refresh the rollout
    if: ${{ vars.RMAC_APT_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: apt-refresh
    # Shared with release.yml's apt-repository job: one publication at a
    # time, never cancelled.
    concurrency:
      group: rmac-apt-publication
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: write
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
      snapshot: ${{ steps.publish.outputs.snapshot }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make room for two releases of packages
        # publish-apt-snapshot.py refuses to cross a 15 GiB free-space floor.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Rebuild the live repository and publish the next phase or a fresh signature
        id: publish
        # The requested phase reaches the shell only as an environment
        # variable: `${{ }}` inside `run:` is pasted into the script text
        # before bash parses it.
        env:
          GH_TOKEN: ${{ github.token }}
          RMAC_APT_SIGNING_SUBKEY: ${{ secrets.RMAC_APT_SIGNING_SUBKEY }}
          RMAC_ARCHIVE_SIGNING_FINGERPRINT: ${{ vars.RMAC_ARCHIVE_SIGNING_FINGERPRINT }}
          REQUESTED_PHASE: ${{ github.event.inputs.phase }}
        run: |
          set -euo pipefail
          arguments=(
            --mode rollout
            --repository "$GITHUB_REPOSITORY"
            --work "$RUNNER_TEMP/apt-publication"
          )
          if [ -n "$REQUESTED_PHASE" ]; then
            arguments+=(--phase "$REQUESTED_PHASE")
          fi
          bash scripts/linux/publish-apt-repository.sh "${arguments[@]}"

      - name: Upload the Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.publish.outputs.site }}

  pages:
    name: Deploy the APT repository to GitHub Pages
    # Same as release.yml's apt-pages job.
    needs: [rollout]
    if: needs.rollout.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: rmac-apt-pages
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip a site that a newer publication already superseded
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ needs.rollout.outputs.snapshot }}
        run: |
          set +e
          python3 scripts/linux/apt-publication.py is-newest \
            --repository "$GITHUB_REPOSITORY" --snapshot "$SNAPSHOT"
          status=$?
          set -e
          case "$status" in
            0) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "deploy=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Deploy to GitHub Pages
        if: steps.fresh.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
