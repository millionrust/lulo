[package]
name = "rmac-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
notify.workspace = true
rmac-storage.workspace = true
serde.workspace = true
serde_json.workspace = true

# The no-replace rename (renameat2's RENAME_NOREPLACE). Lulo mode's desktop
# on Windows (rmac-win-shell) uses this crate's model too and renames with
# MoveFileExW instead.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The Desktop known folder, attributes and the no-replace move on Windows
# (the shared desktop view; ADR 0023, "Phase 3 revised: shared shell views").
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
