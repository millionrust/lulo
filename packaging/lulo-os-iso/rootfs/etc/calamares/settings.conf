# Lulo OS installer (ADR 0029). Calamares 3.3 from the Ubuntu 26.04 archive.
---
modules-search: [ local ]

instances:
- id: lulo_cleanup
  module: shellprocess
  config: shellprocess_lulo_cleanup.conf
- id: lulo_bootloader_packages
  module: contextualprocess
  config: lulo_bootloader_packages.conf
- id: lulo_finish
  module: shellprocess
  config: shellprocess_lulo_finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - shellprocess@lulo_cleanup
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - contextualprocess@lulo_bootloader_packages
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - shellprocess@lulo_finish
  - umount
- show:
  - finished

branding: lulo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
