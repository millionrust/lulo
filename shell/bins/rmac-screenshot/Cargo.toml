[package]
name = "rmac-shell-screenshot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "screenshot"
path = "src/main.rs"

[features]
default = []
wayland = ["gpui_platform/wayland", "rmac-shell-layer/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
async-channel.workspace = true
blocking.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
rmac-compositor.workspace = true
rmac-compositor-niri.workspace = true
rmac-shell-layer.workspace = true
rmac-shell-ui.workspace = true
rmac-sound.workspace = true
rmac-storage.workspace = true
uuid.workspace = true

# Windows: the Lulo layer hosts the service (`service::start`), reading the
# window list and the screen's pixels itself (`capture`).
[target.'cfg(windows)'.dependencies]
image = { workspace = true, features = ["png"] }
rmac-compositor-system.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
