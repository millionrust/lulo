[package]
name = "rmac-pasteboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# The system clipboard for files (wl-clipboard on Linux, NSPasteboard on
# macOS). Deliberately minimal: no GUI toolkit, so any process — including
# ones that must stay lean, like the resident wallpaper renderer — can
# depend on it directly. See src/lib.rs.
[dependencies]
async-channel.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }

# The real Windows clipboard: CF_HDROP (the format Explorer's own Copy/Cut/
# Paste uses) plus the "Preferred DropEffect" format Explorer reads to tell
# a cut from a copy.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
