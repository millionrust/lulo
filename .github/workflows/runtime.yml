name: Lulo runtime

# A change to docs/**/*.md alone plays nothing back (docs/ci.md "Build
# speed"); any other file runs every check.
on:
  push:
    paths-ignore:
      - "docs/**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**/*.md"

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all app and shell binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # CI-only build settings, as in ci.yml (docs/ci.md "Build speed"):
    # sccache serves compiled crates from the GitHub Actions cache and mold
    # links; release and candidate builds keep their own settings.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang cmake libclang-dev mold libfontconfig1-dev libfreetype-dev libpam0g-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Build and stage binaries
        run: |
          cargo build --locked --workspace --bins
          (cd shell && cargo build --locked --workspace --bins --features wayland)
          python3 scripts/behavior/runtime_ci.py stage target/debug shell/target/debug runtime-bin
          strip --strip-unneeded runtime-bin/*
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-binaries
          path: runtime-bin/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3

  # Two of the eight scenario shards per runner, one after the other: the
  # free plan runs about 20 jobs at once across CI and this workflow, and
  # each runner spends about a minute downloading and installing first.
  scenarios:
    name: Scenarios ${{ matrix.shards }} of 8
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shards: ["0 1", "2 3", "4 5", "6 7"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-binaries
          path: runtime-bin
      - name: Install private Wayland runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core dbus fonts-inter grim libglib2.0-bin libxkbcommon-x11-0 mesa-vulkan-drivers \
            poppler-utils python3-dbusmock python3-pyatspi sway wl-clipboard xdg-desktop-portal
      - name: Play recorded scenarios
        env:
          SHARDS: ${{ matrix.shards }}
        run: |
          chmod +x runtime-bin/*
          for binary in runtime-bin/rmac-*; do
            if ldd "$binary" | grep -q 'not found'; then
              echo "Missing shared library for $binary"
              ldd "$binary" | grep 'not found'
              exit 1
            fi
          done
          python3 scripts/behavior/runtime_ci.py prepare runtime-bin
          for SHARD in $SHARDS; do
            echo "::group::Scenarios $SHARD/8"
            result="$RUNNER_TEMP/runtime-results/scenario-$SHARD"
            mkdir -p "$result/screenshots"
            set +e
            /usr/bin/python3 scripts/behavior/run_lulo.py \
              --bin-dir runtime-bin --shard "$SHARD/8" \
              --capture-dir "$result/screenshots" \
              --output "$result/behavior-results.json" > "$result/runner.log" 2>&1
            status=$?
            set -e
            cat "$result/runner.log"
            printf '{"exit_code":%s}\n' "$status" > "$result/status.json"
            echo "::endgroup::"
          done
      - name: Upload scenario results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-scenarios-${{ strategy.job-index }}
          path: ${{ runner.temp }}/runtime-results/
          if-no-files-found: error
          retention-days: 7

  # The seventeen checks packed onto four runners, run one after another,
  # each with its own private session and result directory: about six
  # minutes of playback per runner (run 38369865318's timings). idle-cpu
  # runs first on a fresh runner; intelligence-unit, which turns on lingering
  # and the user-namespace AppArmor policy, runs last on its runner.
  checks:
    name: ${{ matrix.suites }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suites:
          - idle-cpu power-dialogs spotlight-intents
          - desktop-paint window-move 01-files 02-text-editor 09-menu-bar
          - menu-dismiss 03-settings 04-calculator 06-notes
          - 05-preview 07-terminal 08-shell 10-spotlight intelligence-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-binaries
          path: runtime-bin
      - name: Install private Wayland runtime and pinned niri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core curl dbus dbus-user-session fonts-inter foot gir1.2-gtk-4.0 grim libdisplay-info3 \
            libgbm1 libglib2.0-bin libinput10 libpango-1.0-0 \
            libpangocairo-1.0-0 libpipewire-0.3-0t64 libseat1 libxkbcommon-x11-0 \
            mesa-vulkan-drivers poppler-utils python3-dbus python3-dbusmock python3-gi python3-pil \
            python3-pyatspi sway xdg-desktop-portal
          curl --fail --silent --show-error --location --retry 3 \
            https://ppa.launchpadcontent.net/avengemedia/danklinux/ubuntu/pool/main/n/niri/niri_26.04ppa3_amd64.deb \
            --output "$RUNNER_TEMP/niri.deb"
          printf '%s  %s\n' \
            f44c5b1c9cb8838c538618caccbbed5a5173ba04569983beae61c59ec0e38cb0 \
            "$RUNNER_TEMP/niri.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/niri.deb" "$RUNNER_TEMP/niri-package"
          ldd "$RUNNER_TEMP/niri-package/usr/bin/niri" | tee "$RUNNER_TEMP/niri-libs.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/niri-libs.txt"
          test ! -e /usr/bin/orca
      - name: Run private nested compositor checks
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          chmod +x runtime-bin/*
          for binary in runtime-bin/rmac-*; do
            if ldd "$binary" | grep -q 'not found'; then
              echo "Missing shared library for $binary"
              ldd "$binary" | grep 'not found'
              exit 1
            fi
          done
          python3 scripts/behavior/runtime_ci.py prepare runtime-bin
          niri="$RUNNER_TEMP/niri-package/usr/bin/niri"
          export PATH="$(dirname "$niri"):$PATH"
          for SUITE in $SUITES; do
            echo "::group::$SUITE"
            result="$RUNNER_TEMP/runtime-results/$SUITE"
            mkdir -p "$result"
            set +e
            case "$SUITE" in
              menu-dismiss) /usr/bin/python3 scripts/behavior/run_menu_dismiss.py --niri "$niri" --bin-dir runtime-bin --capture-dir "$result/screenshots" ;;
              power-dialogs) /usr/bin/python3 scripts/behavior/run_power_dialogs.py --niri "$niri" --bin-dir runtime-bin --capture-dir "$result/screenshots" ;;
              window-move) /usr/bin/python3 scripts/behavior/run_window_move.py --niri "$niri" --bin-dir runtime-bin ;;
              # Desktop icons and img() loads paint on an idle, inactive surface with no input.
              # ADR 0024: "Lulo can do this" rows off/on, confirm, idle exit.
              spotlight-intents) /usr/bin/python3 scripts/behavior/run_spotlight_intents.py --niri "$niri" --bin-dir runtime-bin ;;
              # ADR 0024: the caller check under the real systemd user unit, with
              # Ubuntu's user-namespace AppArmor policy on, as on the laptop.
              intelligence-unit)
                sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
                sudo loginctl enable-linger "$USER"
                /usr/bin/python3 scripts/behavior/run_intelligence_unit.py --bin-dir runtime-bin ;;
              desktop-paint) /usr/bin/python3 scripts/behavior/run_desktop_first_paint.py --niri "$niri" --bin-dir runtime-bin --probe runtime-bin/img-paint --capture-dir "$result/screenshots" ;;
              # Thirteen untouched apps and shell pieces for four minutes, with no
              # Focus/Notification Center/PipeWire service on the private bus.
              idle-cpu)
                /usr/bin/python3 scripts/behavior/run_memory_soak.py --niri "$niri" --bin-dir runtime-bin \
                  --output-dir "$result/soak" --duration-hours 0.07 --sample-interval-seconds 60 \
                  --activity-interval-seconds 0 --idle-settle-seconds 60 --max-idle-cpu-percent 3
                soak_status=$?
                cat "$result/soak/session.log" "$result/soak/done.json" 2>/dev/null
                (exit "$soak_status") ;;
              *) /usr/bin/python3 scripts/parallel/run_lulo_journey.py --niri "$niri" --bin-dir runtime-bin --output "$result/screenshots" "$SUITE" ;;
            esac > "$result/runner.log" 2>&1
            status=$?
            set -e
            cat "$result/runner.log"
            printf '{"exit_code":%s}\n' "$status" > "$result/status.json"
            echo "::endgroup::"
          done
      - name: Upload check results and Lulo screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-checks-${{ strategy.job-index }}
          path: ${{ runner.temp }}/runtime-results/
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Runtime summary (non-blocking)
    if: always()
    needs: [build, scenarios, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: lulo-runtime-*
          path: runtime-downloads
          merge-multiple: true
      - name: Merge and gate results
        run: |
          set +e
          python3 scripts/behavior/runtime_ci.py summarize runtime-downloads runtime-summary.md
          status=$?
          set -e
          cat runtime-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload merged summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-runtime-summary
          path: runtime-summary.md
          if-no-files-found: warn
          retention-days: 7
