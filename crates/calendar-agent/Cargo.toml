[package]
name = "rmac-calendar-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmac-calendar-agent"
path = "src/main.rs"

[dependencies]
# "serde" only derives Serialize/Deserialize for DateTime<Utc> in alerts.json
# (crate::state); it adds no new crate since serde is already a workspace
# dependency everywhere.
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
rmac-calendar-eds.workspace = true
rmac-calendar-runtime.workspace = true
rmac-calendar-store.workspace = true
rmac-storage.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rmac-dbus.workspace = true
rustix = { workspace = true, features = ["time"] }
zbus.workspace = true
