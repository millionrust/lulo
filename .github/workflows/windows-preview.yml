name: Windows preview build

# ADR 0023: an optimised build of the Lulo apps that run on Windows (now
# including Files and the Lulo layer -- the menu bar, Dock and Spotlight
# over the Windows desktop, phase 3), zipped (unsigned) for hands-on
# testing, and a real per-user MSI installer (ADR 0023's "Installer"
# section) built from the same exes. Code signing is wired in but skipped
# -- never faked -- until the owner's Azure Trusted Signing secrets exist
# (see the `installer` job). Runs on demand, or on a push to the
# `windows-preview` branch.
on:
  workflow_dispatch:
  push:
    branches: [windows-preview]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows preview apps
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Record the workspace version
        id: version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each app's exe icon (ADR 0023 "Installer"): rasterised from this
      # repo's own artwork, never Apple's, before the apps are built so
      # rmac-windows-resource-build's build.rs can embed it. A build that
      # skips this step (a plain local `cargo build`) still succeeds, with
      # the platform's default binary icon.
      - name: Generate Windows app icons
        run: bash scripts/windows/make_icons.sh

      - name: Build the apps
        run: |
          cargo build --locked --release -p rmac-calculator -p rmac-notes \
            -p rmac-text-editor -p rmac-preview -p rmac-clock -p rmac-weather \
            -p rmac-terminal -p rmac-finder -p rmac-system-settings \
            -p rmac-win-shell --bins

      - name: Collect the built exes
        run: |
          mkdir -p exes
          for app in calculator notes text-editor preview clock weather terminal files system-settings; do
            cp "target/release/rmac-$app.exe" exes/
          done
          cp target/release/lulo-session.exe target/release/lulo-shell.exe exes/

      - name: Upload the built exes
        # Consumed by the `installer` job below; not for direct download.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-windows-exes
          path: exes
          retention-days: 7

      - name: Package the preview zip
        run: |
          out=lulo-windows-preview
          mkdir -p "$out"
          cp exes/*.exe "$out/"
          # Lulo's wallpapers, which Settings ▸ Wallpaper shows and can set
          # as the Windows desktop picture; on Windows they live beside the
          # executables (rmac-wallpaper's `packaged_wallpaper_dir`).
          mkdir -p "$out/wallpapers"
          cp packaging/rmac-session/wallpapers/*.jpg "$out/wallpapers/"
          cat > "$out/README.txt" <<'EOF'
          Lulo apps for Windows - preview build (${{ github.sha }})

          Unsigned test build. Windows SmartScreen may warn the first time:
          choose "More info", then "Run anyway".

          Double-click any rmac-*.exe to open that app, or use
          Lulo-Setup-*.msi (a separate artifact on this run) for a real
          Start Menu install with an uninstaller. Shortcuts use Ctrl where
          the Mac uses Cmd (Ctrl+N, Ctrl+S, Ctrl+Q...). Press Alt to open
          the menu bar at the top of each window.

          rmac-system-settings.exe sets the appearance, accent colour,
          wallpaper and alert sound every Lulo app uses. Keep the
          wallpapers folder next to the apps.

          The Lulo layer: double-click lulo-session.exe to put Lulo's menu
          bar, Dock and Spotlight (Alt+Space) over the Windows desktop. The
          Windows taskbar hides while it runs. Lulo menu > Turn Off Lulo
          gives the normal desktop back; so does running
          "lulo-session.exe --restore-windows-desktop" if anything goes
          wrong. Lulo apps opened while the layer runs show their menus in
          its menu bar. The installer's own Start Menu shortcut for Lulo
          runs lulo-session.exe the same way, but never starts it on its
          own.
          EOF
          7z a -tzip "$out.zip" "$out" > /dev/null

      - name: Upload the preview zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-windows-preview
          path: lulo-windows-preview.zip
          retention-days: 14

  installer:
    name: Build the Windows installer
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      filename: ${{ steps.build.outputs.filename }}
    steps:
      # Full history (commits only, no trees or blobs beyond HEAD's): the
      # MSI's version is <major>.<minor>.<commit count>
      # (packaging/windows/msi_version.py, WIN-OS-54).
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Download the built exes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-windows-exes
          path: exes

      - name: Install the WiX Toolset CLI
        # Pinned exact version for reproducibility (ADR 0023 "Installer":
        # WiX, not Inno Setup or MSIX -- see that section for why). 5.0.2,
        # not a newer release: WiX 6 added an "Open Source Maintenance Fee"
        # EULA gate on its own pre-built binaries (still MS-RL source, but
        # a separate runtime EULA -acceptEula flag this build does not
        # accept on the owner's behalf); 5.0.2 is the newest release from
        # before that gate existed. No `wix extension add` is needed:
        # Product.wxs and generate_apps_wxs.py's output use only core WiX
        # elements.
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the installer
        id: build
        run: |
          version="${{ needs.build.outputs.version }}"
          filename="Lulo-Setup-$version-x64.msi"
          bash packaging/windows/build-installer.sh exes "$version" "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      # Azure Trusted Signing: skipped, never faked, until the owner
      # provides RMAC_TRUSTED_SIGNING_* secrets (ADR 0023 "Installer").
      # `continue-on-error` so a signing failure never blocks the unsigned
      # artifact everyone can already use.
      - name: Sign the installer (Azure Trusted Signing)
        if: ${{ vars.RMAC_TRUSTED_SIGNING_ACCOUNT != '' }}
        continue-on-error: true
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.RMAC_TRUSTED_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.RMAC_TRUSTED_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.RMAC_TRUSTED_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ vars.RMAC_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.RMAC_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.RMAC_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-windows-installer
          path: ${{ steps.build.outputs.filename }}
          retention-days: 14

  installer-test:
    name: Install, run, and uninstall the Windows installer
    needs: [installer]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-windows-installer
          path: installer

      - name: Install, launch, and uninstall, checking every step
        run: |
          python3 scripts/windows/installer_smoke.py "installer/${{ needs.installer.outputs.filename }}"
