[package]
name = "rmac-shell-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
async-channel.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
rmac-compositor.workspace = true
rmac-compositor-system.workspace = true
uuid.workspace = true

# Layer surfaces as Win32 windows (ADR 0023, "Phase 3 revised: shared shell
# views").
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
