name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run (dev keeps every
# run), so agents re-pushing a branch do not hold runners for stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

# CI-only build settings (docs/ci.md "Build speed"); release.yml and
# candidate.yml do not use them. No debug info and no incremental state:
# smaller objects build faster, and sccache can only cache non-incremental
# compiles. Jobs that compile set RUSTC_WRAPPER=sccache after
# mozilla-actions/sccache-action, which stores each compiled crate in the
# GitHub Actions cache, so a branch run reuses dev's crates. Nothing here
# saves a `target` directory: one such entry (5-13 GB) fills the
# repository's 10 GB cache budget and evicts every sccache entry.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  # The Windows jobs' packages (ADR 0023): Clippy and the tests cover these.
  RMAC_WINDOWS_PACKAGES: >-
    -p rmac-calculator -p rmac-notes -p rmac-text-editor -p rmac-editor
    -p rmac-notes-store -p rmac-notes-storage -p rmac-notes-runtime
    -p rmac-ui -p rmac-storage -p rmac-recent-documents
    -p rmac-preview -p rmac-clock -p rmac-weather -p rmac-terminal
    -p rmac-portal -p rmac-print-linux -p rmac-spelling -p rmac-sound
    -p rmac-finder -p rmac-mounts -p rmac-search -p rmac-app-launch
    -p rmac-pasteboard -p rmac-archive -p rmac-quick-look
    -p rmac-system-settings -p rmac-appearance-portal
    -p rmac-app-menu -p rmac-win-shell -p rmac-compositor-system
    -p rmac-shell-runtime -p rmac-launcher-app -p rmac-quick-settings-app -p rmac-osd
    -p rmac-app-drawer -p rmac-hardware
    -p rmac-activity-monitor -p rmac-player -p rmac-archive-utility
    -p rmac-mail -p rmac-mail-runtime -p rmac-mail-graph -p rmac-mail-storage
    -p rmac-mail-smtp -p rmac-mail-imap -p rmac-mail-mime
    -p rmac-accounts-linux -p rmac-win-toast
    -p rmac-calendar -p rmac-calendar-agent -p rmac-calendar-store

jobs:
  # Only `docs/**/*.md` changed: the Rust, Windows and macOS jobs are
  # skipped (the Python suite, which reads the docs, still runs). Anything
  # else, or a diff that cannot be read, runs everything.
  changes:
    name: Changed files
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check whether only docs changed
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            base=$DEFAULT_BRANCH  # a new branch: compare with dev
          else
            base=$BEFORE
          fi
          code=true
          # The compare API lists at most 300 files; a longer list runs everything.
          if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$HEAD" --jq '.files[].filename'); then
            count=$(printf '%s\n' "$files" | grep -c . || true)
            other=$(printf '%s\n' "$files" | grep -vcE '^docs/.+\.md$' || true)
            echo "$count changed files since $base, $other outside docs/**/*.md"
            if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] && [ "$other" -eq 0 ]; then
              code=false
            fi
          else
            echo "Could not compare $base...$HEAD; running every job"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # ubuntu-26.04 hosted runners went GA 2026-09-17 (todo.md "Move the Linux
  # jobs from ubuntu-24.04 to Ubuntu 26.04"). These two jobs have no apt-get
  # step (release-contracts is pure Python; dependency-policy's cargo-deny
  # runs inside its own Docker image regardless of host OS), so moving them
  # is effectively zero-risk. The GPUI jobs below stay on ubuntu-24.04 until
  # the non-blocking `linux-2604` job (see below) has run clean for a while;
  # see docs/ci.md.
  release-contracts:
    name: Release contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      - name: Verify release contracts
        run: python3 scripts/run-release-contract-checks.py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          log-level: error
          command: check
          arguments: --locked
          command-arguments: --hide-inclusion-graph

  linux:
    name: Linux checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      # mold links the test binaries in CI only; release and candidate
      # builds keep the toolchain's default linker.
      RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            dbus \
            mold \
            python3-dbusmock

      - name: Install pinned Rust toolchain
        if: needs.changes.outputs.code == 'true'
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      # Compiled crates come from the GitHub Actions cache (docs/ci.md
      # "Build speed"); the post step prints the hit rate.
      - name: Set up sccache
        if: needs.changes.outputs.code == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Check formatting
        if: needs.changes.outputs.code == 'true'
        run: python3 scripts/check-rustfmt.py

      - name: Check shared-control boundary
        run: bash scripts/check-shared-controls.sh

      - name: Check background-executor command boundary
        run: bash scripts/check-background-executor-command.sh

      - name: Check gpui_component migration boundary
        run: bash scripts/check-gpui-component-imports.sh

      - name: Check that no macOS screenshots are tracked
        run: bash scripts/check-no-mac-captures.sh

      - name: Check design token boundary
        run: bash scripts/check-design-tokens.sh

      - name: Check user-facing wording
        run: python3 scripts/check-wording.py --fail

      - name: Check Linux reference tooling
        run: |
          bash -n scripts/linux/collect-reference-evidence.sh \
            scripts/linux/run-reference-gates.sh
          bash scripts/linux/collect-reference-evidence.sh /tmp/rmac-linux-evidence
          test -s /tmp/rmac-linux-evidence/environment.txt

      - name: Run Clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      # The AccountsService and cups-pk-helper tests run against
      # python-dbusmock on a private bus; here a missing mock is a failure.
      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        env:
          RMAC_REQUIRE_DBUSMOCK: "1"
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  linux-2604:
    name: Linux checks (Ubuntu 26.04, non-blocking)
    # Migration path for todo.md's "Move the Linux jobs from ubuntu-24.04 to
    # Ubuntu 26.04": mirrors the `linux` job above on the now-GA
    # ubuntu-26.04 hosted runner (2026-09-17). Kept non-blocking until it has
    # run clean for a while (apt package names/versions differ across LTS
    # releases and are unverified here); see docs/ci.md.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            dbus \
            mold \
            python3-dbusmock

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      # Compiled crates come from the GitHub Actions cache (docs/ci.md
      # "Build speed"); the post step prints the hit rate.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Check formatting
        run: python3 scripts/check-rustfmt.py

      - name: Run Clippy
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      # The AccountsService and cups-pk-helper tests run against
      # python-dbusmock on a private bus; here a missing mock is a failure.
      - name: Run tests
        env:
          RMAC_REQUIRE_DBUSMOCK: "1"
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  macos:
    name: macOS checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      # Compiled crates come from the GitHub Actions cache (docs/ci.md
      # "Build speed"); the post step prints the hit rate.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Run Clippy
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # ADR 0023 on Windows, in five jobs that run side by side (docs/ci.md
  # "Windows"): Clippy, the unit tests, and one debug build of the apps,
  # whose exes the three launch jobs download instead of building again.
  #
  # Phases 1-2c: Calculator, Notes, Text Editor, Preview, Clock, Weather
  # and Terminal, with the shared crates they need (rmac-ui, storage,
  # editor, Notes' store, the print/portal/spelling/sound seams), build,
  # pass Clippy and their unit tests, and open a window on Windows; the
  # launch check also opens each window's menu strip with Alt, presses
  # Ctrl+N and, for Text Editor, hands a second launch to the running app.
  # Preview also opens a tiny fixture PDF and checks that Windows.Data.Pdf
  # (`winpdf.rs`) rendered its page. It also prints each app's launch time
  # and 20 s idle-CPU reading, and checks that opening Calculator then
  # Weather without closing Calculator leaves Weather in the foreground.
  # Phase 2d adds Files (crates/finder): real Favourites/Locations
  # (SHGetKnownFolderPath, drive enumeration), Open with the default app,
  # Move to Bin through the real Recycle Bin, colour tags in an NTFS
  # alternate data stream, and a crash-safe Copy/Move journal and Undo
  # with real Windows locking — all with their own passing unit tests.
  # Linux-only pieces (the xdg-trash-spec Bin view/restore, Add to Dock,
  # atomic replace/exchange, Unix-identity-dependent rename survival)
  # are honest, test-gated stubs; see docs/parity.md's WIN-OS-18..20.
  # Phase 3's Lulo layer (`rmac-win-shell`: lulo-session and lulo-shell)
  # is checked in its own launch job: the bar's and the Dock's work-area
  # strips, the Dock opening Calculator, Calculator's menus in the bar, a
  # maximised window between the two, Spotlight on Alt+Space, and the
  # taskbar and work area restored on exit. Lulo mode (ADR 0023 "Lulo
  # mode"): Lulo's desktop under every window with Explorer's icons
  # hidden, its icons opening, renaming and dragging, Lulo windows'
  # shadow, Spotlight as the bar alone, apps opened in front of a
  # maximised File Explorer, memory after use, and every way out (Turn
  # Off, sign-out, crashes, uninstall) giving the desktop back.
  # Every job is blocking. Within a job, later checks still run after a
  # failed one (`!cancelled()`), so one run reports every kind of breakage.
  windows-clippy:
    name: Windows Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      # The shell's views (shell/bins, shell/crates; ADR 0023, "Phase 3
      # revised: shared shell views") are libraries of the shell workspace
      # that lulo-shell links, so Clippy checks their Windows code there.
      - name: Run Clippy
        run: |
          cargo clippy --locked --keep-going $RMAC_WINDOWS_PACKAGES --all-targets -- -D warnings
          # Notification Centre on Windows (ADR 0023): its views, the
          # bus-less service and the notification pipe.
          cargo clippy --locked --keep-going -p rmac-notification-center-app \
            -p rmac-notifications -p rmac-notifications-linux --all-targets -- -D warnings
          (cd shell && cargo clippy --locked --keep-going \
            -p rmac-shell-layer -p rmac-shell-menubar -p rmac-shell-dock -p rmac-shell-wallpaper \
            -p rmac-shell-app-switcher \
            --lib --tests -- -D warnings)

  windows-tests:
    name: Windows tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      # gpui_windows (ADR 0025) runs with the apps' packages so it builds
      # with the same features: its frame-loop tests and upstream's own.
      - name: Run tests
        run: |
          cargo test --locked --no-fail-fast $RMAC_WINDOWS_PACKAGES -p gpui_windows
          (cd shell && cargo test --locked --no-fail-fast -p rmac-shell-layer -p rmac-shell-app-switcher --lib)
          # The notification pipe's wire format (ADR 0023).
          cargo test --locked --no-fail-fast -p rmac-notifications --lib
          # The settings store's own tests assume Unix files; the Windows
          # Dock migration is checked on its own.
          cargo test --locked -p rmac-shell-settings --lib a_windows_dock_saved_before_apps
          # Bluetooth's WinRT backend leaves no apartment on a pool thread
          # (op/win-com); its other tests assume BlueZ.
          cargo test --locked -p rmac-bluetooth --lib win::tests

      # The hardware profile (ADR 0027) on a real Windows: it prints what it
      # found and fails when detection is over its 20 ms budget or panics.
      - name: Hardware profile
        run: cargo run --locked -p rmac-hardware --bin rmac-hardware -- --check

  windows-build:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      # Each exe's own icon (rmac-windows-resource-build embeds
      # packaging/windows/icons/<id>.ico when it exists), so the launch
      # check can prove Files, lulo-shell and lulo-session carry theirs.
      - name: Make the Windows icons
        run: bash scripts/windows/make_icons.sh

      - name: Build the apps
        run: |
          cargo build --locked -p rmac-calculator -p rmac-notes -p rmac-text-editor \
            -p rmac-preview -p rmac-clock -p rmac-weather -p rmac-terminal \
            -p rmac-finder -p rmac-system-settings -p rmac-win-shell -p rmac-hardware \
            -p rmac-activity-monitor -p rmac-mail -p rmac-calendar \
            -p rmac-calendar-agent -p rmac-player -p rmac-archive-utility --bins

      - name: Upload the apps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-apps
          path: target/debug/*.exe
          if-no-files-found: error
          retention-days: 1

  # The apps' launch, menu, idle-CPU and memory checks, in three parts on
  # three runners, each on the exes from `windows-build`.
  windows-launch:
    name: Windows launch (${{ matrix.part }})
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: apps 1
            artifact: windows-app-screens-1
            apps: rmac-calculator rmac-notes rmac-text-editor rmac-preview rmac-clock
            launch: --world-tick-check
            # One World Clock minute tick may cost Clock at most 3 ticks (ADR
            # 0023 phase 2e).
            gate: --max-world-tick-ticks 3
            expect: rmac-calculator rmac-notes rmac-text-editor rmac-preview rmac-clock
          - part: apps 2
            artifact: windows-app-screens-2
            apps: rmac-weather rmac-terminal rmac-files rmac-system-settings
            launch: --foreground-check rmac-calculator
            gate: ""
            expect: rmac-weather rmac-terminal rmac-files rmac-system-settings
          # ADR 0023 phase 2f. Archive Utility has no window (as on the
          # Mac): the launch script expands a fixture zip with it instead,
          # so it is checked but has no idle reading. Every app here stays
          # under 400 MB private at idle.
          - part: apps 3
            artifact: windows-app-screens-3
            apps: rmac-system-monitor rmac-mail rmac-calendar rmac-player rmac-archive-utility
            launch: ""
            gate: --app-private-mb 400
            expect: rmac-system-monitor rmac-mail rmac-calendar rmac-player
          - part: Lulo layer
            artifact: windows-shell-screens
            apps: ""
            launch: --shell
            # lulo-shell's working set at idle within 60 MB (8 GB PCs;
            # WIN-OS-39). Lulo mode (ADR 0023 "Lulo mode", WIN-OS-43): 30 s
            # after one use of Spotlight and a menu again, lulo-shell's
            # private bytes must be within the budget and close to their
            # reading after the first use (closed panels give their Direct3D
            # memory back each time), and within 60 MB at idle too
            # (WIN-OS-53: the owner's Radeon laptop reads 55.8 MB at idle
            # and 59.0 MB after use, ADR 0023). Idle, from its `settled`
            # mark and over a window without a minute boundary, lulo-shell
            # wakes at most 4 times (ADR 0023 "Idle from the settled mark").
            gate: >-
              --shell-memory-mb 60 --shell-idle-private-mb 60
              --shell-after-use-private-mb 60 --shell-after-use-growth-mb 4
              --shell-max-wakes 4
              --shell-after-panels-private-mb 60
            expect: lulo-shell lulo-session
            installer: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the apps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-apps
          path: target/debug

      # The installed layout: Lulo's fonts in a `fonts` folder beside the
      # exes, which every app maps (WIN-OS-99). The launch check fails an
      # app that reports a missing face.
      - name: Lay out the fonts beside the apps
        run: |
          mkdir -p target/debug/fonts
          cp assets/fonts/inter/*.otf assets/fonts/jetbrains-mono/*.ttf target/debug/fonts/

      # `windows-build` made the icons before building (it fails without
      # them), so every exe must carry its own. Each app's first frame must
      # be on screen within 900 ms of its process starting (WIN-OS-99:
      # debug builds on the runner's software renderer, 140 to 430 ms, and
      # System Monitor's first process sample; the reference laptop's
      # release builds are measured by hand, docs/parity.md WIN-OS-99).
      - name: Launch each app
        id: launch
        env:
          LULO_EXPECT_EXE_ICONS: "1"
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.1.1
          python scripts/windows/launch_smoke.py --screenshots windows-screens \
            ${{ matrix.launch }} --results windows-results.json \
            --launch-budget-ms 1200 target/debug ${{ matrix.apps }}

      # System Settings (WIN-SET): every pane its sidebar lists on the runner
      # opens with content, and the red traffic light, Ctrl+W, Ctrl+Q and
      # Alt+F4 each close the window and end the process.
      - name: System Settings panes and close
        if: ${{ !cancelled() && contains(matrix.apps, 'rmac-system-settings') }}
        run: python scripts/windows/settings_smoke.py target/debug --screenshots windows-screens/settings

      # Blocking: no app but Terminal, and neither Lulo layer process, may
      # use more than one 15.6 ms tick of CPU over 20 s with no input (ADR
      # 0025's parked frame loop; ADR 0023 phase 3); the part's own budgets
      # are in the matrix above. The runner's software GPU (WARP) is counted
      # apart: idle_gate.py. A missing results file or an expected app
      # without a reading fails.
      - name: Idle gate
        if: ${{ !cancelled() }}
        run: >-
          python scripts/windows/idle_gate.py windows-results.json --budget-ticks 1
          --exempt rmac-terminal ${{ matrix.gate }} --expect ${{ matrix.expect }}

      # A newer MSI must replace an older one's files (WIN-OS-54): build
      # 100, then build 101, then 101 re-stamped, each installed over the
      # one before, then uninstalled (scripts/windows/upgrade_smoke.py).
      # WiX 5.0.2 as in windows-preview.yml (ADR 0023 "Installer").
      - name: Installer upgrade
        if: ${{ !cancelled() && matrix.installer }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$HOME/.dotnet/tools:$PATH"
          python scripts/windows/upgrade_smoke.py target/debug/lulo-session.exe "$RUNNER_TEMP/lulo-upgrade"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            windows-screens
            windows-results.json
          if-no-files-found: ignore
          retention-days: 7

  upstream-gpui-linux:
    name: Current GPUI Linux runtime gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            clang \
            dbus \
            jq \
            libfontconfig1-dev \
            libfreetype-dev \
            libglib2.0-bin \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            mold \
            python3-pyatspi \
            sway \
            wayland-utils

      - name: Install experiment Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt

      # Compiled crates come from the GitHub Actions cache (docs/ci.md
      # "Build speed"); the post step prints the hit rate.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Check experiment formatting
        working-directory: shell
        run: cargo fmt --all -- --check

      # cargo-deny runs in its own (musl) container, which has neither
      # sccache nor mold.
      - name: Check shell dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        env:
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
        with:
          log-level: error
          manifest-path: shell/Cargo.toml
          command: check
          arguments: --locked
          command-arguments: --config shell/deny.toml --hide-inclusion-graph

      - name: Test shell support library
        working-directory: shell
        run: cargo test --locked --lib

      # The vendored backend is not a workspace member; its touch gesture
      # recogniser (ADR 0028) is pure and tested here.
      - name: Test vendored GPUI touch gestures
        working-directory: shell
        run: cargo test --locked -p gpui_linux --lib touch

      - name: Check Wayland probes
        working-directory: shell
        run: cargo clippy --locked --bins --features wayland -- -D warnings

      - name: Run nested Wayland smoke checks
        working-directory: shell
        run: dbus-run-session -- bash scripts/nested-wayland-smoke.sh
