[package]
name = "rmac-time-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-channel.workspace = true
rmac-time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io.workspace = true
futures-util.workspace = true
rmac-dbus.workspace = true
rustix = { workspace = true, features = ["time"] }
zbus.workspace = true

# The Win32 time-zone, clock, privilege, registry and service APIs, and a
# hidden window for the clock-change broadcasts (`win.rs`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }
