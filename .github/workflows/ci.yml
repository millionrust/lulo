name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu-26.04 hosted runners went GA 2026-09-17 (todo.md "Move the Linux
  # jobs from ubuntu-24.04 to Ubuntu 26.04"). These two jobs have no apt-get
  # step (release-contracts is pure Python; dependency-policy's cargo-deny
  # runs inside its own Docker image regardless of host OS), so moving them
  # is effectively zero-risk. The GPUI jobs below stay on ubuntu-24.04 until
  # the non-blocking `linux-2604` job (see below) has run clean for a while;
  # see docs/ci.md.
  release-contracts:
    name: Release contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      - name: Verify release contracts
        run: python3 scripts/run-release-contract-checks.py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          log-level: error
          command: check
          arguments: --locked
          command-arguments: --hide-inclusion-graph

  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libfontconfig1-dev \
            libfreetype-dev \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            dbus \
            python3-dbusmock

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: python3 scripts/check-rustfmt.py

      - name: Check shared-control boundary
        run: bash scripts/check-shared-controls.sh

      - name: Check background-executor command boundary
        run: bash scripts/check-background-executor-command.sh

      - name: Check gpui_component migration boundary
        run: bash scripts/check-gpui-component-imports.sh

      - name: Check that no macOS screenshots are tracked
        run: bash scripts/check-no-mac-captures.sh

      - name: Check design token boundary
        run: bash scripts/check-design-tokens.sh

      - name: Check user-facing wording
        run: python3 scripts/check-wording.py --fail

      - name: Check Linux reference tooling
        run: |
          bash -n scripts/linux/collect-reference-evidence.sh \
            scripts/linux/run-reference-gates.sh
          bash scripts/linux/collect-reference-evidence.sh /tmp/rmac-linux-evidence
          test -s /tmp/rmac-linux-evidence/environment.txt

      - name: Run Clippy
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      # The AccountsService and cups-pk-helper tests run against
      # python-dbusmock on a private bus; here a missing mock is a failure.
      - name: Run tests
        env:
          RMAC_REQUIRE_DBUSMOCK: "1"
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  linux-2604:
    name: Linux checks (Ubuntu 26.04, non-blocking)
    # Migration path for todo.md's "Move the Linux jobs from ubuntu-24.04 to
    # Ubuntu 26.04": mirrors the `linux` job above on the now-GA
    # ubuntu-26.04 hosted runner (2026-09-17). Kept non-blocking until it has
    # run clean for a while (apt package names/versions differ across LTS
    # releases and are unverified here); see docs/ci.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libfontconfig1-dev \
            libfreetype-dev \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            dbus \
            python3-dbusmock

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-2604-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: python3 scripts/check-rustfmt.py

      - name: Run Clippy
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      # The AccountsService and cups-pk-helper tests run against
      # python-dbusmock on a private bus; here a missing mock is a failure.
      - name: Run tests
        env:
          RMAC_REQUIRE_DBUSMOCK: "1"
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # test_build_cursors draws with Pillow; test_release_workflows parses YAML.
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1 PyYAML==6.0.3

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run Clippy
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Windows apps (non-blocking)
    # ADR 0023 phase 1: Calculator, Notes and Text Editor, with the shared
    # crates they use, build, pass Clippy and their unit tests, and open a
    # window on Windows. Non-blocking until it has run clean for a while;
    # see docs/ci.md.
    runs-on: windows-latest
    timeout-minutes: 75
    continue-on-error: true
    env:
      RMAC_WINDOWS_PACKAGES: >-
        -p rmac-calculator -p rmac-notes -p rmac-text-editor -p rmac-editor
        -p rmac-notes-store -p rmac-notes-storage -p rmac-notes-runtime
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # One cache entry per lockfile, saved once even when a later step
      # fails, so a red run still warms the next one.
      - name: Restore Cargo data
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run Clippy
        run: cargo clippy --locked --keep-going $RMAC_WINDOWS_PACKAGES --all-targets -- -D warnings

      # The remaining steps still run after a Clippy failure, so one run
      # reports every kind of Windows breakage.
      - name: Run tests
        if: ${{ !cancelled() }}
        run: cargo test --locked $RMAC_WINDOWS_PACKAGES

      - name: Build the apps
        if: ${{ !cancelled() }}
        run: cargo build --locked -p rmac-calculator -p rmac-notes -p rmac-text-editor --bins

      - name: Launch each app
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.1.1
          python scripts/windows/launch_smoke.py --screenshots windows-screens \
            target/debug rmac-calculator rmac-notes rmac-text-editor

      - name: Upload app screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app-screens
          path: windows-screens
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Cargo data
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  upstream-gpui-linux:
    name: Current GPUI Linux runtime gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            clang \
            dbus \
            jq \
            libfontconfig1-dev \
            libfreetype-dev \
            libglib2.0-bin \
            libpam0g-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            python3-pyatspi \
            sway \
            wayland-utils

      - name: Install experiment Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt

      - name: Cache experiment Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: ${{ runner.os }}-upstream-gpui-${{ hashFiles('shell/Cargo.lock', 'shell/rust-toolchain.toml') }}

      - name: Check experiment formatting
        working-directory: shell
        run: cargo fmt --all -- --check

      - name: Check shell dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          log-level: error
          manifest-path: shell/Cargo.toml
          command: check
          arguments: --locked
          command-arguments: --config shell/deny.toml --hide-inclusion-graph

      - name: Test shell support library
        working-directory: shell
        run: cargo test --locked --lib

      - name: Check Wayland probes
        working-directory: shell
        run: cargo clippy --locked --bins --features wayland -- -D warnings

      - name: Run nested Wayland smoke checks
        working-directory: shell
        run: dbus-run-session -- bash scripts/nested-wayland-smoke.sh
