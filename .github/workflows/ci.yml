name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          log-level: error
          command: check
          arguments: --locked
          command-arguments: --hide-inclusion-graph

  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Test performance harness
        run: python3 -m unittest scripts/test_measure_baseline.py

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Test performance harness
        run: python3 -m unittest scripts/test_measure_baseline.py

  upstream-gpui-linux:
    name: Current GPUI Linux runtime gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            clang \
            dbus \
            jq \
            libfontconfig1-dev \
            libfreetype-dev \
            libglib2.0-bin \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            python3-pyatspi \
            sway \
            wayland-utils

      - name: Install experiment Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt

      - name: Cache experiment Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            experiments/gpui-upstream-lab/target
          key: ${{ runner.os }}-upstream-gpui-${{ hashFiles('experiments/gpui-upstream-lab/Cargo.lock', 'experiments/gpui-upstream-lab/rust-toolchain.toml') }}

      - name: Check experiment formatting
        working-directory: experiments/gpui-upstream-lab
        run: cargo fmt --all -- --check

      - name: Check Wayland probes
        working-directory: experiments/gpui-upstream-lab
        run: cargo clippy --locked --bins --features wayland -- -D warnings

      - name: Run nested Wayland smoke checks
        working-directory: experiments/gpui-upstream-lab
        run: dbus-run-session -- bash scripts/nested-wayland-smoke.sh
