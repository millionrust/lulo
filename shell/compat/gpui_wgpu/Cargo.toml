# Vendored from zed-industries/zed @ 76c93968da5b8b8809bdd72e4ad9e7d0e946bad0
# (crates/gpui_wgpu, Apache-2.0, see LICENSE-APACHE). rmac's changes sit in
# separate commits on top of this unmodified import so a GPUI bump can
# re-import and re-apply them; see docs/decisions/0013-gpui-linux-patch.md.
# The upstream benches/ directory and its criterion dev-dependency are left
# out: nothing in rmac runs them.
[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed.git", package = "gpui", default-features = false }
anyhow = "1.0.86"
bytemuck = "1"
collections = { version = "=0.1.0", git = "https://github.com/zed-industries/zed.git", package = "collections" }
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-segmentation = "1.10"
gpui_util = { version = "=0.1.0", git = "https://github.com/zed-industries/zed.git", package = "gpui_util" }
wgpu = "29.0.4"

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"
