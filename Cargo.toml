[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

# Optimised but quick to relink, for trying changes on the reference PC:
# `cargo build --profile iterate`. Release keeps fat LTO for shipping.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[patch."https://github.com/zed-industries/zed.git"]
ztracing = { path = "shell/compat/ztracing" }
gpui_linux = { path = "shell/compat/gpui_linux" }
