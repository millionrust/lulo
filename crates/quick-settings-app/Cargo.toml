[package]
name = "rmac-quick-settings-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rmac-quick-settings"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
blocking.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# Display ▸ Dark Mode saves the appearance the way System Settings does.
rmac-appearance.workspace = true
rmac-appearance-portal.workspace = true
rmac-gtk-settings.workspace = true
rmac-media.workspace = true
rmac-compositor.workspace = true
rmac-compositor-system.workspace = true
rmac-osd.workspace = true
rmac-quick-settings.workspace = true
rmac-quick-settings-system.workspace = true
rmac-shell-activation-runtime.workspace = true
rmac-shell-runtime.workspace = true
rmac-shortcuts.workspace = true
rmac-theme.workspace = true
rmac-ui.workspace = true
rust-embed.workspace = true

# The Windows shell hosts this surface; `rmac-shell-layer` places it as
# the layer surface it is on Linux (ADR 0023).
[target.'cfg(windows)'.dependencies]
rmac-shell-layer.workspace = true
