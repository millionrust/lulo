<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System Settings — macOS 26 panes, exact</title>
<!--
  System Settings (crates/system-settings) at 1:1 logical points, measured on
  the owner's Mac (macOS 26.2 Tahoe, dark, 2026-09-23). Sources: AX frames of
  every element in the Settings window (System Events, window at 700,33 ×
  723 × 832) for General, Appearance, Desktop & Dock, Wallpaper, Displays,
  Sound, Wi-Fi, Bluetooth, Battery and Menu Bar, plus Retina pixels ÷ 2.
  Rust copies these into crates/system-settings/src/controller/settings_style.rs.
  Glyphs are the SVGs the Rust loads (crates/system-settings/assets/icons and
  gpui-component's icons), inlined below; they are Lucide, not SF Symbols.
  All x/y are relative to the window's top-left corner.

  Window        723 × 832 (not resizable narrower on the Mac), radius 27,
                fill rgb(32,33,45); toolbar 52, transparent over the window
  Traffic       centres (26,26) (49,26) (72,26) inside the sidebar panel
  Sidebar panel floating, x 8, y 8, 215 × (h − 16), radius 19 (27 − 8),
                fill rgb(29,29,40), edge rgba(255,255,255,.10); the split is at
                x 223 (panel + 8)
  Search        x 18, y 61, 195 × 28, capsule, fill rgb(46,47,58); glyph 15 at
                x 26 rgb(161,162,166); placeholder 13 at x 46 rgb(150,151,156)
  List          scrolls from y 98 under the search field
  Account row   46 tall; avatar 38 circle at x 24; name 13 bold, "Apple
                Account" 11 regular secondary, both at x 70
  Rows          x 18, 195 × 32, radius 8; icon tile 20 at x 24 (row + 6),
                label 13 regular rgb(244,244,244) at x 49 (row + 31)
  Sections      13 pt gap between groups, no titles
  Selection     rgb(36,88,202) accent while the sidebar has focus in the key
                window (white text); rgb(70,70,70) otherwise
  Back/Forward  one 73 × 36 capsule at x 231, y 8: two 36 segments with a 1 pt
                divider; enabled chevron rgb(233,233,235), disabled
                rgb(105,106,121); capsule fill rgb(39,40,56) edge rgb(56,58,84)
  Title         x 316 (capsule + 12), 15 bold rgb(232,232,234), centred on y 26
  Detail        x 223 → 723 (500), content inset 20 → 460 wide at x 243; it
                starts at y 52 and scrolls under the toolbar
  Group         radius 12, fill rgb(39,40,51), no border; 10 between groups
  Form row      37 tall + a 1 pt separator (38 pitch), padding 10; label 13
                regular rgb(222,222,224); subtitle 11 regular rgb(158,158,163)
                2 below; separator rgb(49,50,61) inset 10 both sides
  Section head  13 bold rgb(220,220,222) at x 253; 30 below the previous group
                and 10 above its group; the first one sits 3 below y 52
  Nav row       42 tall; icon 20 at x + 10, label at x + 40; value secondary;
                chevron rgb(92,93,101) 14 from the right
  Hero          (General, Accessibility) a group 164 tall: icon 52 centred 24
                from the top, title 22 bold on a 26 line, description 13
                secondary on 16 lines, ≤ 397 wide, 20 bottom padding
  Header card   (Wi-Fi, Bluetooth) icon 26 at x + 10, title 13 and 11 pt
                description at x + 48, 44 × 20 switch 10 from the right
  Pop-up        value 13 then a 20 circle rgb(55,56,67) holding ⌃⌄, 24 tall,
                10 from the row's right edge
  Switch        36 × 16 (header cards 44 × 20); on #397CF7, off rgb(60,61,71),
                capsule thumb rgb(226,226,228)
  Slider        track 6, fill #397CF7, rest rgb(60,61,71); knob 20 × 16 capsule
                rgb(223,223,225); tick dots 1 × 2; labels 11 below
  Info (i)      17 circle outline, 12 from the row's right edge
  Push button   24 tall, radius 6, fill rgb(55,56,67), label 13
  Help (?)      24 circle rgb(55,56,67), right-aligned 10 below the last group;
                not drawn in rmac, which has no help book for it to open. The
                pane's own buttons (Refresh, Revert, Choose Image…) take that
                right-aligned footer row instead.
  Segmented     24 tall, full row width, selected #397CF7, rest rgb(55,56,67)

  Second wave (same window, AX frames + Retina pixels, 2026-09-23): Network,
  a network service, Notifications and an app's page, Focus and a mode,
  Lock Screen, Privacy & Security and Camera, Keyboard and its Keyboard
  Shortcuts sheet, Trackpad (all three tabs), Date & Time, Language &
  Region, Login Items & Extensions, Sharing (and its File Sharing sheet),
  Accessibility and Display, Spotlight, About, Software Update, Storage.
  The owner's Mac has no mouse and no VPN, so Settings shows neither pane:
  Mouse copies Trackpad's grammar and VPN the Wi-Fi known-network rows.

  Icon row      52 tall (53 pitch): icon 26 at x + 11, vertically centred;
                title 13/16 and subtitle 11/14 at x + 48, 10 padding, 2 gap
                (Network services, Notifications apps, Focus modes, Login
                background items; Sharing's are 50 tall)
  Status line   8 pt dot then 4 gap then 11 pt secondary: connected
                rgb(104,206,103), not connected rgb(235,83,78), inactive
                rgb(92,93,101)
  Header card   65 tall: icon 26 at (11, 12), title 13 at x + 48, 1 gap,
                description 11 secondary (Notifications, Privacy,
                Accessibility, Spotlight — Accessibility has no hero)
  Section note  11 pt rgb(154,155,160) 2 under a section head, 10 above the
                group (Notification Centre, Login Items, Focus sections)
  Nav row 42    unchanged; counts as values (Privacy "4", Storage sizes)
  Slider row    label left, 242 wide slider from x + 208, 6 pt track, tick
                dots under it, 11 pt end labels; row 51 tall (Trackpad)
  Twin sliders  Keyboard's first group is 75 tall with two 210 wide sliders
                at x + 10 and x + 240, label above, ends below
  Tabs          Trackpad: 460 × 24, radius 6, selected #397CF7, rest
                rgb(48,49,60); the group starts 18 under it
  Radio         16 circles; a row's options right-aligned, 14 apart
  List well     a group holding a table: 28 header, 24 rows, then a 24 pt
                +/− bar under a 1 pt rule (Language, Login Items)
  Storage bar   group 87: name + "x of y used" at y + 12; bar 21 tall at
                x + 10, 440 wide, radius 3, 1 pt gaps rgb(49,50,60), free
                rgb(68,69,78) with its size centred; legend 8 pt dots 11 pt.
                Category colours in order: rgb(235,83,78), rgb(240,151,72),
                rgb(248,216,73), rgb(104,206,103), rgb(99,215,195),
                rgb(95,207,221); System Data rgb(128,128,128)
  Sheet         Keyboard Shortcuts: 670 × 468 centred (27, 182), radius 26,
                fill rgb(31,33,44); sidebar panel 200 wide inset 8, fill
                rgb(27,28,35), 32 pt rows; content group 430 wide at x 228,
                y 20; footer rule at y 403, buttons 24 tall 12 from the
                bottom-right (Done #3478F6)
  PC Keyboard   rmac-only group (the Mac has no PC keys), knowledge-based, S:
                ordinary switch/pop-up rows in Keyboard's grammar; Caps Lock
                choices copy the Mac's Modifier Keys sheet minus Globe.
                docs/decisions/0017-mac-keyboard.md
  Omitted here and in rmac because rmac has no backend for them: every
  Mac-only row (Firewall, Notification Centre previews, Alert Style, Focus
  sharing and status, display sleep and login-window options, Dictation,
  keyboard brightness, Force Click, More Gestures, 24-hour time, time zone
  by location, calendar/temperature/measurement pickers, Live Text, Media/
  Screen/Bluetooth/Printer/Internet sharing, Zoom, Hearing, Speech, Related
  Content, Siri, device art and serial number, iCloud recommendations) and
  every Help (?) button.
-->
<!-- self-contained: lab.css class names (.search, .row, .tile) would collide -->
<style>
  :root{
    --win:rgb(32,33,45); --panel:rgb(29,29,40); --panel-edge:rgba(255,255,255,.10);
    --group:rgb(39,40,51); --sep:rgb(49,50,61); --label:rgb(222,222,224); --sec:rgb(158,158,163);
    --head:rgb(220,220,222); --side:rgb(244,244,244); --title:rgb(232,232,234);
    --search:rgb(46,47,58); --ph:rgb(150,151,156); --sel-grey:rgb(70,70,70); --sel-blue:rgb(36,88,202);
    --accent:#397CF7; --off:rgb(60,61,71); --knob:rgb(226,226,228); --ctl:rgb(55,56,67);
    --chev:rgb(92,93,101); --cap:rgb(39,40,56); --cap-edge:rgb(56,58,84);
    --font:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  }
  body{margin:0;background:#111;font:13px var(--font);color:var(--label);-webkit-font-smoothing:antialiased}
  .stage{padding:24px;display:flex;flex-wrap:wrap;gap:24px}
  .win{position:relative;width:723px;height:832px;background:var(--win);border-radius:27px;overflow:hidden;flex:none;
       box-shadow:0 0 0 .5px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.14)}
  .panel{position:absolute;left:8px;top:8px;width:215px;bottom:8px;border-radius:19px;background:var(--panel);
       box-shadow:inset 0 0 0 1px var(--panel-edge);overflow:hidden}
  .tl{position:absolute;top:19px;left:19px;display:flex;gap:9px;z-index:3}
  .tl i{width:14px;height:14px;border-radius:50%;display:block}
  .tl i:nth-child(1){background:#EC6765}.tl i:nth-child(2){background:#F2CA44}.tl i:nth-child(3){background:#65C466}
  .search{position:absolute;left:10px;top:53px;width:195px;height:28px;border-radius:14px;background:var(--search);
       display:flex;align-items:center;color:var(--ph)}
  .search svg{position:absolute;left:8px;width:15px;height:15px;color:rgb(161,162,166)}
  .search span{position:absolute;left:28px}
  .list{position:absolute;left:10px;top:90px;width:195px;bottom:0;overflow:hidden}
  .acct{height:46px;display:flex;align-items:center;position:relative}
  .acct .av{position:absolute;left:6px;width:38px;height:38px;border-radius:50%;background:rgb(84,85,96);
       display:flex;align-items:center;justify-content:center;color:rgb(190,190,196)}
  .acct .av svg{width:22px;height:22px}
  .acct b{position:absolute;left:52px;top:7px;font:700 13px/16px var(--font);color:var(--side)}
  .acct small{position:absolute;left:52px;top:23px;font:400 11px/14px var(--font);color:var(--sec)}
  .gap{height:13px}
  .row{height:32px;border-radius:8px;position:relative;display:flex;align-items:center;color:var(--side)}
  .row.sel{background:var(--sel-grey)} .row.sel.focus{background:var(--sel-blue);color:#fff}
  .tile{width:20px;height:20px;border-radius:5.5px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
  .tile svg{width:12.5px;height:12.5px}
  .row .tile{position:absolute;left:6px}
  .row span{position:absolute;left:31px}
  .cap{position:absolute;left:231px;top:8px;width:73px;height:36px;border-radius:18px;background:var(--cap);
       box-shadow:inset 0 0 0 1px var(--cap-edge);display:flex;align-items:center}
  .cap b{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:rgb(233,233,235)}
  .cap b.off{color:rgb(105,106,121)} .cap b svg{width:17px;height:17px}
  .cap hr{width:1px;height:20px;border:0;margin:0;background:rgba(255,255,255,.10)}
  .title{position:absolute;left:316px;top:16px;font:700 15px/20px var(--font);color:var(--title)}
  .detail{position:absolute;left:223px;top:52px;width:500px;padding:0 20px;box-sizing:border-box;bottom:0;overflow:hidden}
  .h{font:700 13px/16px var(--font);color:var(--head);padding:0 10px;margin:20px 0 10px}
  .detail > .h:first-child{margin-top:3px}
  .g{background:var(--group);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .r{min-height:37px;padding:10px;display:flex;align-items:center;gap:8px;position:relative;box-sizing:border-box}
  .r + .r{margin-top:1px}
  .r + .r::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:1px;background:var(--sep)}
  .r .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .r .t b{font:400 13px/16px var(--font);color:var(--label)}
  .r .t small{font:400 11px/14px var(--font);color:var(--sec)}
  .r.top{align-items:flex-start}
  .r.nav{height:42px;padding:0 14px 0 10px}
  .r.nav .tile{margin-right:10px}
  .v{color:var(--label)} .v.sec{color:var(--sec)}
  .pop{display:flex;align-items:center;gap:6px;height:24px;color:var(--label)}
  .pop i{width:20px;height:20px;border-radius:50%;background:var(--ctl);display:flex;align-items:center;justify-content:center;margin-right:2px}
  .pop i svg{width:12px;height:12px;color:var(--label)}
  .sw{width:36px;height:16px;border-radius:8px;background:var(--off);position:relative;flex:none}
  .sw::after{content:"";position:absolute;left:1.5px;top:1.5px;width:21px;height:13px;border-radius:7px;background:var(--knob)}
  .sw.on{background:var(--accent)} .sw.on::after{left:13.5px;background:#E1EBFE}
  .sw.big{width:44px;height:20px;border-radius:10px} .sw.big::after{width:26px;height:17px;top:1.5px;border-radius:9px}
  .sw.big.on::after{left:16.5px}
  .chev{width:14px;height:14px;color:var(--chev)}
  .info{width:17px;height:17px;color:var(--label);margin-right:2px}
  .btns{display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px}
  .pb{height:24px;padding:0 10px;border-radius:6px;background:var(--ctl);display:inline-flex;align-items:center;color:var(--label)}
  .help{width:24px;height:24px;border-radius:50%;background:var(--ctl);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .slider{flex:1;display:flex;flex-direction:column;gap:5px}
  .track{height:6px;border-radius:3px;background:var(--off);position:relative;margin:5px 0}
  .track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
  .track .knob{position:absolute;top:-5px;width:20px;height:16px;border-radius:8px;background:rgb(223,223,225);margin-left:-10px}
  .ticks{display:flex;justify-content:space-between;padding:0 9px;margin-top:-3px}
  .ticks i{width:1px;height:2px;background:rgb(92,93,101)}
  .ends{display:flex;justify-content:space-between;font-size:11px;line-height:14px;color:var(--label)}
  .seg{display:flex;height:24px;border-radius:6px;background:var(--ctl);flex:1}
  .seg b{flex:1;display:flex;align-items:center;justify-content:center;font-weight:400;border-radius:6px}
  .seg b.on{background:var(--accent);color:#fff}
  .hero{height:164px;display:flex;flex-direction:column;align-items:center;padding-top:24px;box-sizing:border-box}
  .hero .tile{width:52px;height:52px;border-radius:12px} .hero .tile svg{width:32px;height:32px}
  .hero b{margin-top:10px;font:700 22px/26px var(--font);color:var(--label)}
  .hero p{margin:0;max-width:397px;text-align:center;font:400 13px/16px var(--font);color:var(--sec)}
  .hc{display:flex;align-items:flex-start;padding:10px;gap:12px}
  .hc .tile{width:26px;height:26px;border-radius:7px} .hc .tile svg{width:16px;height:16px}
  .hc .t{flex:1;display:flex;flex-direction:column;gap:2px}
  .hc .t b{font:400 13px/16px var(--font)} .hc .t small{font:400 11px/14px var(--font);color:var(--sec)}
  .thumbs{display:flex;gap:10px;padding:0 10px}
  .thumbs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
  .thumbs i{width:146px;height:96px;border-radius:8px;display:block}
  .cb{width:16px;height:16px;border-radius:4px;background:rgb(62,63,73);display:inline-block;vertical-align:middle;margin-right:6px}
  .cb.on{background:var(--accent);position:relative}
  .cb.on::after{content:'✓';position:absolute;inset:0;color:#fff;font:700 11px/16px var(--font);text-align:center}
  /* second wave (Network … Storage) */
  .r.big{min-height:52px;padding:10px 10px 10px 11px;gap:11px}
  .r.big .ic{width:26px;height:26px;flex:none;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
  .r.big .ic svg{width:16px;height:16px}
  .r.big .t small{display:flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .hdr{display:flex;align-items:flex-start;padding:10px 10px 10px 11px;gap:11px;min-height:65px;box-sizing:border-box}
  .hdr .ic{width:26px;height:26px;border-radius:7px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff}
  .hdr .ic svg{width:16px;height:16px}
  .hdr .t{flex:1;display:flex;flex-direction:column;gap:1px}
  .hdr .t b{font:400 13px/16px var(--font)} .hdr .t small{font:400 11px/14px var(--font);color:var(--sec)}
  .h.withnote{margin-bottom:2px}
  .note{font:400 11px/14px var(--font);color:rgb(154,155,160);padding:0 10px;margin-bottom:10px}
  .rad{display:flex;gap:14px;align-items:center}
  .rad span{display:flex;align-items:center;gap:6px}
  .rad i{width:16px;height:16px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center}
  .rad i.on{background:var(--accent)} .rad i.on::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
  .tabs{display:flex;height:24px;border-radius:6px;background:rgb(48,49,60);margin:0 0 18px}
  .tabs b{flex:1;display:flex;align-items:center;justify-content:center;font-weight:400;border-radius:6px}
  .tabs b.on{background:var(--accent);color:#fff}
  .ss{display:flex;flex-direction:column;gap:3px}
  .ss .track{margin:5px 0 0}
  .ss .ticks{padding:0 9px;margin-top:2px}
  .ss .ends{font-size:11px;line-height:14px}
  .well{background:var(--group);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .well .hd{display:flex;height:28px;align-items:center;padding:0 10px;font:400 11px var(--font);color:var(--sec);border-bottom:1px solid var(--sep)}
  .well .li{display:flex;height:24px;align-items:center;padding:0 10px;gap:8px}
  .well .li:nth-child(even){background:rgba(255,255,255,.03)}
  .well .pm{display:flex;height:24px;align-items:center;gap:0;border-top:1px solid var(--sep);padding-left:4px;color:var(--label)}
  .well .pm b{width:20px;text-align:center;font-weight:400} .well .pm hr{width:1px;height:12px;border:0;margin:0 2px;background:var(--sep)}
  .sbar{display:flex;height:21px;gap:1px;background:rgb(49,50,60);border-radius:3px;overflow:hidden;margin:0 10px}
  .sbar i{display:block;height:100%}
  .sbar .free{background:rgb(68,69,78);color:rgb(212,212,214);font:400 11px/21px var(--font);text-align:center;flex:1}
  .legend{display:flex;gap:12px;padding:6px 10px 10px;font:400 11px/14px var(--font);color:var(--sec)}
  .legend span{display:flex;align-items:center;gap:4px}
  .info17{width:17px;height:17px;flex:none;color:var(--label);display:flex}
  .sheet{position:absolute;left:27px;top:182px;width:670px;height:468px;border-radius:26px;background:rgb(29,30,41);
       box-shadow:0 0 0 1px rgba(255,255,255,.12),0 20px 60px rgba(0,0,0,.6);overflow:hidden;z-index:5}
  .sheet .sb{position:absolute;left:8px;top:8px;width:200px;bottom:8px;border-radius:18px;background:rgb(24,25,34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .sheet .sb .row{margin:0 10px}
  .sheet .body{position:absolute;left:228px;top:20px;width:430px}
  .sheet .foot{position:absolute;left:208px;right:0;bottom:0;height:65px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:flex-end;padding:0 12px 0 20px}
  .done{height:24px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;display:inline-flex;align-items:center}
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4}
  .cap-label{position:absolute;left:0;top:-22px;color:#9a9aa2;font:12px var(--font)}
  .frame{position:relative;margin-top:22px}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
