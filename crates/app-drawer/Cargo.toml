[package]
name = "rmac-app-drawer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rmac-app-drawer"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
blocking.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rmac-apps.workspace = true
rmac-app-launch.workspace = true
rmac-icon.workspace = true
rmac-shortcuts.workspace = true
rmac-shell-activation-runtime.workspace = true
rmac-ui.workspace = true

# The Windows shell hosts this surface; `rmac-shell-layer` places it as the
# layer surface it is on Linux (ADR 0023).
[target.'cfg(windows)'.dependencies]
rmac-shell-layer.workspace = true
