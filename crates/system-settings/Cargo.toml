[package]
name = "rmac-system-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rmac-system-settings"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
async-io.workspace = true
blocking.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
rmac-appearance.workspace = true
rmac-appearance-portal.workspace = true
rmac-app-launch.workspace = true
rmac-compositor.workspace = true
rmac-apps.workspace = true
rmac-display.workspace = true
rmac-locale.workspace = true
rmac-mounts.workspace = true
rmac-portal.workspace = true
rmac-recent-documents.workspace = true
rmac-storage.workspace = true
rmac-shortcuts.workspace = true
rmac-shell-settings.workspace = true
rmac-sound.workspace = true
rmac-system-info.workspace = true
rmac-theme.workspace = true
rmac-ui.workspace = true
rmac-wallpaper.workspace = true
rmac-wallpaper-image.workspace = true
rmac-wallpaper-system.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
rmac-audio.workspace = true
rmac-accounts.workspace = true
rmac-accounts-linux.workspace = true
rmac-accounts-ui.workspace = true
rmac-bluetooth.workspace = true
rmac-compositor-niri.workspace = true
rmac-focus.workspace = true
rmac-focus-linux.workspace = true
rmac-focus-settings.workspace = true
rmac-gtk-settings.workspace = true
rmac-input.workspace = true
# Settings ▸ Lulo Intelligence (ADR 0024): on/off, hardware gate, model
# download and calibration through the service.
rmac-intelligence = { workspace = true, features = ["client"] }
rmac-keyboard.workspace = true
rmac-login-items.workspace = true
rmac-login-items-linux.workspace = true
rmac-launcher-providers.workspace = true
rmac-locale-linux.workspace = true
rmac-network.workspace = true
rmac-notifications-linux.workspace = true
rmac-notifications.workspace = true
rmac-notifications-store.workspace = true
rmac-osd.workspace = true
rmac-power.workspace = true
rmac-privacy.workspace = true
rmac-printers-linux.workspace = true
rmac-privacy-linux.workspace = true
rmac-process.workspace = true
rmac-screen-reader.workspace = true
rmac-sharing.workspace = true
rmac-sharing-linux.workspace = true
rmac-time.workspace = true
rmac-time-linux.workspace = true
rmac-updates.workspace = true
rmac-updates-linux.workspace = true
rmac-users-linux.workspace = true


# The exe's icon and version resource on Windows (ADR 0023 "Installer").
[target.'cfg(windows)'.build-dependencies]
rmac-windows-resource-build.workspace = true

# The Windows Settings (src/win, ADR 0023 phase 2e): About This PC's
# hardware facts, display modes, the output volume read-out and the
# desktop wallpaper.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
