[package]
name = "rmac-shell-wallpaper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The desktop view is a library shared by Lulo OS's `wallpaper` binary and
# the Windows shell (`rmac-win-shell`); ADR 0023, "Phase 3 revised: shared
# shell views".
[lib]
path = "src/lib.rs"

[[bin]]
name = "wallpaper"
path = "src/main.rs"

[features]
default = []
wayland = ["gpui_platform/wayland", "rmac-shell-layer/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
async-channel.workspace = true
async-io.workspace = true
blocking.workspace = true
chrono.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
rmac-apps.workspace = true
rmac-app-launch.workspace = true
rmac-app-menu.workspace = true
rmac-archive.workspace = true
rmac-calendar-agent.workspace = true
rmac-compositor.workspace = true
rmac-compositor-system.workspace = true
rmac-desktop.workspace = true
rmac-desktop-widgets.workspace = true
rmac-dock.workspace = true
rmac-dock-runtime.workspace = true
rmac-dock-system.workspace = true
rmac-locale.workspace = true
rmac-pasteboard.workspace = true
rmac-power.workspace = true
rmac-places.workspace = true
rmac-recent-documents.workspace = true
rmac-search.workspace = true
rmac-shell-layer.workspace = true
rmac-shell-runtime.workspace = true
rmac-shell-settings.workspace = true
rmac-shell-status.workspace = true
rmac-sound.workspace = true
rmac-shell-ui.workspace = true
rmac-storage.workspace = true
rmac-thumbnails.workspace = true
rmac-theme.workspace = true
rmac-wallpaper.workspace = true
rmac-wallpaper-image.workspace = true
rmac-wallpaper-runtime.workspace = true
rmac-weather.workspace = true
trash.workspace = true
uuid.workspace = true

# Lulo OS only: Wayland drags, the lock screen's picture over D-Bus, the
# Mission Control reveal socket and Evolution Data Server's calendars.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux.workspace = true
libc.workspace = true
rmac-compositor-niri.workspace = true
rmac-osd.workspace = true
zbus.workspace = true
