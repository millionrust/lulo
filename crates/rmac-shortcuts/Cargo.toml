[package]
name = "rmac-shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-channel.workspace = true
async-io.workspace = true
futures-util.workspace = true
rmac-storage.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
blocking.workspace = true
libc.workspace = true
rmac-dbus.workspace = true
zbus.workspace = true

# The Lock Screen policy on Windows (`lock_windows.rs`): the screen saver's
# secure timeout, the power scheme's sleep timeout and LockWorkStation.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "rmac-shortcut-broker"
path = "src/bin/broker.rs"

[[bin]]
name = "rmac-shortcut-dispatch"
path = "src/bin/dispatch.rs"

[[bin]]
name = "rmac-locker"
path = "src/bin/locker.rs"

[[bin]]
name = "rmac-lock-coordinator"
path = "src/bin/lock-coordinator.rs"

[[bin]]
name = "rmac-idle-locker"
path = "src/bin/idle-locker.rs"
