# UEFI PCs get grub-efi-amd64 in place of the image's grub-pc, from .debs in
# the image, so the install works offline (ADR 0029). The signed shim and
# GRUB are already installed.
---
dontChroot: false
timeout: 900
firmwareType:
    bios: "-/bin/true"
    "*":
        - command: "apt-get install --yes --no-download -o Dpkg::Options::=--force-confold /usr/share/lulo-installer/debs/grub-efi-amd64_*.deb"
          timeout: 900
