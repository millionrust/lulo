[package]
name = "rmac-calculator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmac-calculator"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# Maths Notes' multi-line input (CALC-06).
rmac-editor.workspace = true
# Convert mode (CALC-06) reuses Spotlight's unit-conversion tables rather
# than a second copy of them.
rmac-launcher-providers.workspace = true
rmac-ui.workspace = true
rust-embed.workspace = true

# The exe's version info and icon (ADR 0023 "Installer"); see build.rs.
[target.'cfg(windows)'.build-dependencies]
rmac-windows-resource-build.workspace = true
