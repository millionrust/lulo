[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["shell"]

[workspace.package]
version = "0.9.0-beta.1"
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
authors = ["rmac"]

# A fast, macOS-feel desktop suite built in Rust on GPUI, targeting Ubuntu/Wayland.
# Developed on macOS (Metal) today; Linux (Vulkan) is the deployment target.

[workspace.dependencies]
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
async-channel = "2"
async-io = "2"
async-process = "2"
blocking = "1"
bzip2 = "0.6"
chrono = "0.4"
cosmic-text = "=0.14.2"
flate2 = "=1.1.9"
gpui = { git = "https://github.com/zed-industries/zed.git", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", package = "gpui_platform", features = ["font-kit", "wayland"] }
gpui-component = { version = "=0.5.2", git = "https://github.com/longbridge/gpui-component.git", rev = "0775df394083c1ed74f36f846b78868d1267398f", package = "gpui-component" }
gpui-component-assets = { version = "=0.5.1", git = "https://github.com/longbridge/gpui-component.git", rev = "0775df394083c1ed74f36f846b78868d1267398f", package = "gpui-component-assets" }
futures-util = { version = "0.3", features = ["io"] }
futures-lite = "2"
image = { version = "0.25.10", default-features = false }
kdl = { version = "=6.5.0", features = ["v1-fallback"] }
libc = "=0.2.186"
libloading = "=0.8.9"
lzma-rs = "0.3"
markdown = "=1.0.0"
notify = "7"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
rmac-apps = { version = "=0.9.0-beta.1", path = "crates/rmac-apps" }
rmac-app-launch = { version = "=0.9.0-beta.1", path = "crates/rmac-app-launch" }
rmac-app-menu = { version = "=0.9.0-beta.1", path = "crates/rmac-app-menu" }
rmac-appearance = { version = "=0.9.0-beta.1", path = "crates/rmac-appearance" }
