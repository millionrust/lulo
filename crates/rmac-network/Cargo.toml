[package]
name = "rmac-network"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Exposes `FakeWifiService` and the shared contract assertions in
# `contract` for other crates' tests, without a live D-Bus session.
test-support = []

[dependencies]
async-channel.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io.workspace = true
futures-util.workspace = true
libloading.workspace = true
rmac-dbus.workspace = true
zbus.workspace = true

# The Windows backend (`win.rs`): the native WLAN API for Wi-Fi and the IP
# Helper API for interfaces, addresses and change notifications.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
rmac-dbus.workspace = true
zbus.workspace = true
