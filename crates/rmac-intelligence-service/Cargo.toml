[package]
name = "rmac-intelligence-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "org.rmac.Intelligence1 (ADR 0024): the on-demand local model service. D-Bus activated, exits after 60 s idle, closed task list, checksum-pinned models, llama.cpp on Linux."

[[bin]]
name = "rmac-intelligence-service"
path = "src/bin/rmac-intelligence-service.rs"

# Measures accuracy and latency on the reference laptop. Not packaged.
[[bin]]
name = "rmac-intelligence-bench"
path = "src/bin/rmac-intelligence-bench.rs"

# org.rmac.Voice1: hold-to-talk speech to text (ADR 0024 §8).
[[bin]]
name = "rmac-voice-service"
path = "src/bin/rmac-voice-service.rs"

# Measures the voice model on recorded clips. Not packaged.
[[bin]]
name = "rmac-voice-bench"
path = "src/bin/rmac-voice-bench.rs"

[dependencies]
async-channel.workspace = true
async-io.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
rmac-intelligence = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true

# llama.cpp (MIT) through llama-cpp-2 (MIT OR Apache-2.0), CPU only, no
# OpenMP and no llama.cpp "common" library: ADR 0024 §3. Built from source
# with CMake; Linux only, so the macOS and Windows builds of the workspace
# never compile it.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2.workspace = true
# Moonshine speech to text (ADR 0024 §8) through the system ONNX Runtime
# (Ubuntu's libonnxruntime, MIT), loaded with dlopen when a capture
# starts: nothing native is built or downloaded.
ort.workspace = true

# The caller-check tests open pidfds (pidfd_open).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
