<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  rmac font policy (FEEL_SPEC.md §D.5).

  Install to /etc/fonts/conf.d/60-rmac.conf from the rmac-session package.

  Three jobs:
    1. Make Inter and JetBrains Mono the system UI and monospace faces.
    2. Render them the way macOS renders text: grayscale antialiasing, no
       hinting, no subpixel fringing. Hinted, subpixel-rendered Inter is the
       single most "Linux" thing on an otherwise correct screen.
    3. Redirect the font names third-party apps and web pages ask for
       (-apple-system, SF Pro, Helvetica Neue, system-ui) to Inter, so Firefox,
       Electron apps and GTK apps stop falling back to DejaVu Sans.
-->
<fontconfig>

  <!-- 1. Generic family defaults ------------------------------------- -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>

  <!-- 2. Apple font names → Inter / JetBrains Mono -------------------- -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro Text</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro Display</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Monaco</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrains Mono</string></edit>
  </match>

  <!-- 3. macOS-like rendering for our two faces ----------------------- -->
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true"><string>Inter</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <!-- Tabular figures everywhere the UI shows changing numbers; the shell
         asks for them per-role too, this is the safety net for third parties. -->
    <edit name="fontfeatures" mode="append"><string>cv08</string></edit>
  </match>

  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true"><string>JetBrains Mono</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <!-- Terminals must not ligate. -->
    <edit name="fontfeatures" mode="append"><string>liga off</string></edit>
    <edit name="fontfeatures" mode="append"><string>calt off</string></edit>
  </match>

  <!-- Emoji fallback: colour emoji after the UI face, never before it. -->
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

</fontconfig>
