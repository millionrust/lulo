<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Finder View Options</title>
<!-- Measured on the owner's macOS 26 Finder, Downloads, 2026-09-29.
     AX: Icon 236x632, List 236x646 logical points. Screenshots remain in /private/tmp.
     Section boundaries: title 0–24; open/browse 24–80; group/sort 80–145;
     list columns start 244; footer button centred 20 points above bottom. -->
<style>
:root{color-scheme:dark;--surface:#202027;--line:#3b3b43;--text:#dddddf;--muted:#a4a4aa;--control:#303038;--accent:#c7c7d1}
*{box-sizing:border-box}body{margin:20px;background:#111;color:var(--text);font:13px system-ui;display:flex;gap:22px;align-items:start}.panel{width:236px;height:646px;border:1px solid var(--line);border-radius:15px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 32px #0008}.panel.icon{height:632px}header{text-align:center;color:var(--muted);height:24px}.section{border-bottom:1px solid var(--line);padding:10px 19px}.section label{display:block;line-height:20px}.indent{margin-left:10px}.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.control{background:var(--control);border-radius:6px;padding:3px 10px;min-width:68px}.columns{padding-top:3px;padding-bottom:9px}.columns label{line-height:20px}.columns strong{font-weight:500}.footer{margin-top:auto;text-align:center;padding:10px}button{border:0;border-radius:6px;background:var(--control);color:var(--text);padding:4px 18px;font:inherit}input{accent-color:var(--accent)}
</style>
<section class="panel icon"><header>Downloads</header><div class="section"><label><input type="checkbox" checked>Always open in icon view</label><label class="indent"><input type="checkbox" checked>Browse in icon view</label></div><div class="section"><div class="row">Group By:<span class="control">None　⌄</span></div><div class="row">Sort By:<span class="control">Date Added　⌄</span></div></div><div class="section"><label>Icon size:　64 × 64</label><input type="range"><label>Grid spacing:</label><input type="range"></div><div class="section"><div class="row">Text size:<span class="control">12　⌄</span></div><label>Label position:</label><label><input type="radio" name="position" checked>Bottom　<input type="radio" name="position">Right</label></div><div class="section"><label><input type="checkbox" checked>Show item info</label><label><input type="checkbox" checked>Show icon preview</label></div><div class="section"><label>Background:</label><label><input type="radio" name="background" checked>Default</label><label><input type="radio" name="background">Colour</label><label><input type="radio" name="background">Picture</label></div><div class="footer"><button>Use as Defaults</button></div></section>
<section class="panel"><header>Downloads</header><div class="section"><label><input type="checkbox" checked>Always open in list view</label><label class="indent"><input type="checkbox" checked>Browse in list view</label></div><div class="section"><div class="row">Group By:<span class="control">None　⌄</span></div><div class="row">Sort By:<span class="control">Date Added　⌄</span></div></div><div class="section"><label>Icon size:　<input type="radio" name="size" checked> ▫　<input type="radio" name="size"> ◻</label><div class="row">Text size:<span class="control">13　⌄</span></div></div><div class="section columns"><strong>Show Columns:</strong><label><input type="checkbox">Date Modified</label><label><input type="checkbox">Date Created</label><label><input type="checkbox">Date Last Opened</label><label><input type="checkbox" checked>Date Added</label><label><input type="checkbox" checked>Size</label><label><input type="checkbox" checked>Kind</label><label><input type="checkbox">Version</label><label><input type="checkbox">Comments</label><label><input type="checkbox">Tags</label></div><div class="section"><label><input type="checkbox" checked>Use relative dates</label><label><input type="checkbox">Calculate all sizes</label><label><input type="checkbox" checked>Show icon preview</label></div><div class="footer"><button>Use as Defaults</button></div></section>
</html>
