# Vendored from zed-industries/zed @ 76c93968da5b8b8809bdd72e4ad9e7d0e946bad0
# (crates/gpui, Apache-2.0, see LICENSE-APACHE). rmac's changes sit in
# separate commits on top of this unmodified import so a GPUI bump can
# re-import and re-apply them; see docs/decisions/0026-vendor-gpui-core.md.
# Only this manifest is rewritten: workspace inheritance is replaced with the
# versions and features from Zed's root manifest at that revision, Zed's
# workspace lints are dropped, the examples, tests and dev-dependencies
# (which need Zed's whole workspace) are left out, and the optional
# criterion and hdrhistogram dependencies are dropped (see [features]). The
# proptest git dependency names its version so cargo-deny's wildcard check
# passes now that the crate is a path dependency.
[package]
name = "gpui"
version = "0.2.2"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
# Zed's benchmark and latency-histogram crates (criterion, hdrhistogram) are
# not in rmac's dependency graph, so these two features carry no dependencies
# here and must not be enabled.
bench = ["test-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
input-latency-histogram = []
profiler = []

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
accesskit = "0.24.0"
anyhow = "1.0.86"
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
bitflags = "2.6.0"

collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "collections" }
ctor = "1.0.6"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
etagere = "0.2"
futures = "0.3.32"
futures-concurrency = "7.7.1"
gpui_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "gpui_macros" }
gpui_shared_string = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "gpui_shared_string" }
http_client = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "http_client" }
image = "0.25.1"
inventory = "0.3.19"
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { version = "1.10.0", git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
profiling = "1"
rand = "0.9"
raw-window-handle = "0.6"
regex = "1.5"
refineable = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "refineable" }
scheduler = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "scheduler" }
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
util_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "util_macros" }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = "2.5.0"
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "sum_tree" }
taffy = "=0.10.1"
thiserror = "2.0.12"
gpui_util = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "gpui_util" }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster = "0.4.0"
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
web-time = "1.1.0"
heapless = "0.9.2"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde", "js"] }


[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-video = { version = "0.5.2", features = ["metal"] }
core-text = "21"
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
media = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", package = "media" }
objc = "0.2"
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
mach2 = "0.5"
#TODO: replace with "objc2"
metal = "0.33"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"
cbindgen = { version = "0.28.0", default-features = false }
