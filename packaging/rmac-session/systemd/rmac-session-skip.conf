# rmac-session vendor drop-in: skip this unit inside the Lulo (rmac) session
# only. The owner's stock Ubuntu GNOME session, and any other desktop that
# shares this systemd --user manager, are unaffected: ExecCondition exits 0
# (continue starting) for every XDG_CURRENT_DESKTOP except rmac, and exits 1
# (a clean, documented skip -- the unit stays "inactive", never "failed")
# only when it names rmac. See scripts/linux/rmac-skip-in-session and
# docs/parity.md (MEM-02).
[Service]
ExecCondition=/usr/libexec/rmac/rmac-skip-in-session
