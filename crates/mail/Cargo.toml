[package]
name = "rmac-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmac-mail"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
rmac-mail-mime.workspace = true
rmac-editor.workspace = true
rmac-ui.workspace = true
rmac-writing-tools.workspace = true
rmac-mail-storage.workspace = true
rmac-mail-smtp.workspace = true
rmac-mail-runtime.workspace = true
rmac-mail-graph.workspace = true
rmac-accounts.workspace = true
rmac-accounts-linux.workspace = true
rmac-portal.workspace = true
rmac-quick-look.workspace = true
rmac-spelling.workspace = true
rmac-print.workspace = true
rmac-storage.workspace = true
rmac-contacts.workspace = true
async-channel.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# File ▸ Print… goes through the desktop Print portal.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
rmac-print-linux.workspace = true

# Windows adds mail accounts from Mail's own Settings (`accounts_win`).
[target.'cfg(windows)'.dependencies]
async-io.workspace = true
rmac-mail-imap.workspace = true

[target.'cfg(windows)'.build-dependencies]
rmac-windows-resource-build.workspace = true
