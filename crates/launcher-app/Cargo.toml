[package]
name = "rmac-launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rmac-launcher"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
async-io.workspace = true
blocking.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rmac-app-menu.workspace = true
rmac-appearance.workspace = true
rmac-apps.workspace = true
# World Clock's city list and time-zone database for "time in tokyo".
rmac-clock.workspace = true
rmac-clipboard.workspace = true
rmac-clipboard-linux.workspace = true
rmac-compositor.workspace = true
rmac-compositor-system.workspace = true
# "Lulo can do this" rows (ADR 0024): the session-bus client, and the
# services those rows change (appearance, brightness).
rmac-intelligence = { workspace = true, features = ["client"] }
rmac-appearance-portal.workspace = true
rmac-gtk-settings.workspace = true
rmac-osd.workspace = true
rmac-theme.workspace = true
rmac-launcher.workspace = true
rmac-launcher-providers.workspace = true
rmac-launcher-runtime.workspace = true
rmac-launcher-system.workspace = true
# ⌘Y on a file result.
rmac-quick-look.workspace = true
rmac-quick-settings-system.workspace = true
rmac-shell-activation-runtime.workspace = true
rmac-shell-settings.workspace = true
rmac-shortcuts.workspace = true
rmac-ui.workspace = true
rust-embed.workspace = true

# The Windows shell hosts this surface; `rmac-shell-layer` places it as
# the layer surface it is on Linux (ADR 0023).
[target.'cfg(windows)'.dependencies]
rmac-shell-layer.workspace = true
