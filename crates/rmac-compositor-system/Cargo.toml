[package]
name = "rmac-compositor-system"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# The desktop's windows for the shell, on whatever the platform has (ADR
# 0023 "Phase 3 revised: shared shell views"): niri's IPC on Lulo OS (and
# every other Unix, where it reports itself unavailable), Win32 windows and
# WinEvent hooks on Windows. Both speak `rmac-compositor`'s snapshots,
# events and actions, so the shell's views are the same on both.

[dependencies]
rmac-compositor.workspace = true

[target.'cfg(unix)'.dependencies]
rmac-compositor-niri.workspace = true

[target.'cfg(windows)'.dependencies]
async-channel.workspace = true
blocking.workspace = true
futures-util.workspace = true
rmac-apps.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
