<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail — viewer and compose</title>
<link rel="stylesheet" href="lab.css">
<!--
  Mail (planned crate `mail`, ADR 0022, docs/design/calendar-mail.md).
  NOT yet measured on the Mac. Chrome, sidebar panel and toolbar capsules reuse
  the Files measurements (design-lab/finder.html); everything Mail-specific is
  an estimate to verify against a read-only capture. Original inline glyphs.

  Window        1180 × 740 (verify), radius 27, toolbar 52
  Sidebar       floating panel x 8 → 220, radius 19; rows 28 (verify) with
                glyph 18 at 10 and label at 36; unread count right-aligned
                11 secondary; section head 11 semibold.
  List column   x 228 → 568 (340 wide, verify). Header "Inbox" 15 bold +
                "1,204 messages, 3 unread" 11 secondary. Rows 74 tall:
                unread dot 9 (accent) at 10; sender 13 semibold (regular
                when read) at 26; date 11 secondary right; subject 12;
                preview 12 secondary, 2 lines; selected row accent fill,
                radius 8, inset 8; hairline between rows inset 26.
  Viewer        from x 568: header 18 inset, avatar 40 circle with initials,
                sender 15 semibold, To/Cc 12 secondary, date 11 right;
                hairline; body 13/19; attachment chips 44 tall radius 10.
  Toolbar       left of list: filter, compose. Over the viewer: archive,
                trash, junk | reply, reply all, forward | flag, move; search
                36 circle at the right.
  Compose       640 × 560, toolbar 52 with send (paper plane, accent when
                To is filled), field rows 34 with 13 pt labels in secondary,
                hairlines inset 16; body 13/19; signature below "--".
-->
<style>
  .win{--win:rgb(33,33,46);--panel:rgb(30,30,39);--panel-edge:rgba(255,255,255,.10);--text:rgb(223,223,225);--strong:rgb(244,244,253);
       --sec:rgb(159,159,165);--hair:rgba(255,255,255,.10);--cap:rgba(255,255,255,.02);--cap-edge:rgba(255,255,255,.14);
       --chip:rgba(255,255,255,.07);--quote:rgba(255,255,255,.25);--side-sel:rgba(255,255,255,.08)}
  .win.light{--win:#FFFFFF;--panel:#F2F2F4;--panel-edge:rgba(0,0,0,.08);--text:#1d1d1f;--strong:#1d1d1f;--sec:#6e6e73;--hair:rgba(0,0,0,.10);
       --cap:rgba(0,0,0,.02);--cap-edge:rgba(0,0,0,.12);--chip:rgba(0,0,0,.05);--quote:rgba(0,0,0,.20);--side-sel:rgba(0,0,0,.07)}
  .stage{padding:24px;display:flex;flex-direction:column;gap:28px}
  .cap-label{font:600 12px var(--font);color:#999;margin:0 0 6px}
  .win{position:relative;width:1180px;height:740px;background:var(--win);border-radius:27px;overflow:hidden;color:var(--text);font-size:13px;
       box-shadow:0 0 0 .5px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.14)}
  .win.light{box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.25)}
  svg.g{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .panel{position:absolute;left:8px;top:8px;bottom:8.5px;width:212px;border-radius:19px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--panel-edge)}
  .tl{position:absolute;top:19px;width:14px;height:14px;border-radius:50%}
  .rows{position:absolute;left:10px;right:10px;top:46px}
  .hd{font:600 11px/17px var(--font);color:var(--sec);margin:12px 0 2px 6px}
  .row{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--strong);border-radius:8px}
  .row.sel{background:var(--side-sel)} .row .g{color:var(--accent)} .row .n{margin-left:auto;font-size:11px;color:var(--sec)}
  .row.sub{padding-left:22px}
  .capb{position:absolute;top:8px;height:36px;border-radius:18px;background:var(--cap);box-shadow:inset 0 0 0 1px var(--cap-edge);display:flex;align-items:center;color:var(--strong)}
  .capb b{width:36px;height:36px;display:flex;align-items:center;justify-content:center} .capb i.div{width:1px;height:20px;background:var(--hair)}
  .list{position:absolute;left:228px;width:340px;top:52px;bottom:0;box-shadow:inset -1px 0 0 var(--hair)}
  .lh{padding:2px 16px 8px} .lh b{font:700 15px var(--font);color:var(--strong)} .lh div{font-size:11px;color:var(--sec)}
  .m{position:relative;height:74px;margin:0 8px;border-radius:8px;padding:8px 10px 0 26px}
  .m::after{content:"";position:absolute;left:26px;right:0;bottom:0;height:1px;background:var(--hair)}
  .m .dot{position:absolute;left:9px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .m .top{display:flex;align-items:baseline;gap:6px} .m .s{font-weight:400;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m.unread .s{font-weight:600} .m .d{margin-left:auto;font-size:11px;color:var(--sec);white-space:nowrap}
  .m .sub{font-size:12px;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
  .m .pv{font-size:12px;color:var(--sec);line-height:15px;height:30px;overflow:hidden}
  .m .cnt{font-size:10px;padding:0 5px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--sec);color:var(--sec)}
  .m.sel{background:var(--accent)} .m.sel *{color:#fff!important} .m.sel .dot{background:#fff} .m.sel::after{display:none}
  .viewer{position:absolute;left:568px;right:0;top:52px;bottom:0;padding:6px 26px 0 22px}
  .vh{display:flex;gap:12px;padding-bottom:12px;box-shadow:inset 0 -1px 0 var(--hair)}
  .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(#9aa0ad,#6c7280);color:#fff;font:600 15px/40px var(--font);text-align:center;flex:none}
  .vh .who{font:600 15px var(--font);color:var(--strong)} .vh .meta{font-size:12px;color:var(--sec);line-height:17px}
  .vh .subj{font:600 13px var(--font);color:var(--strong);margin-top:3px} .vh .date{margin-left:auto;font-size:11px;color:var(--sec)}
  .body{padding-top:16px;line-height:19px;color:var(--strong);max-width:540px} .body p{margin:0 0 12px}
  .body blockquote{margin:0 0 12px;padding-left:10px;box-shadow:inset 2px 0 0 var(--quote);color:var(--sec)}
  .remote{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sec);padding:8px 0;box-shadow:inset 0 -1px 0 var(--hair)}
  .remote span{margin-left:auto;padding:2px 10px;border-radius:6px;background:var(--chip);color:var(--strong)}
  .att{display:flex;gap:8px;margin-top:6px} .att div{height:44px;border-radius:10px;background:var(--chip);display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;font-size:12px}
  .att i{width:28px;height:32px;border-radius:4px;background:#e0e3ea;display:block} .att small{display:block;color:var(--sec);font-size:11px}
  /* compose */
  .cwin{position:relative;width:640px;height:560px;background:var(--win);border-radius:27px;overflow:hidden;color:var(--text);font-size:13px;
        box-shadow:0 0 0 .5px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.14),0 20px 50px rgba(0,0,0,.4)}
  .cwin.light{box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.25)}
  .cwin .ttl{position:absolute;left:96px;top:0;height:52px;display:flex;align-items:center;font:700 15px var(--font);color:var(--strong)}
  .f{position:absolute;left:16px;right:16px;height:34px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 -1px 0 var(--hair)}
  .f .k{color:var(--sec)} .f .tok{padding:1px 8px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--strong)}
  .f .pop{margin-left:auto;color:var(--sec);display:flex;align-items:center;gap:4px}
  .cbody{position:absolute;left:16px;right:16px;top:206px;line-height:19px;color:var(--strong)}
  .send{color:#fff;background:var(--accent)!important;box-shadow:none!important}
  .pair{display:flex;gap:24px;align-items:flex-start}
</style>
</head>
<body>
<header class="lab">
  <h1>Mail</h1>
  <nav><a href="index.html">Overview</a><a href="calendar.html">Calendar</a><a href="mail.html" class="on">Mail</a><a href="internet-accounts.html">Internet Accounts</a><a href="finder.html">Files</a></nav>
  <span class="spacer"></span><span style="font-size:12px;color:#8b8b93">Estimates, not Mac measurements — see the comment at the top</span>
</header>
<div class="stage" id="stage"></div>
<script>
const P = {
  inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/>',
  flag:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>', draft:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  sent:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>', junk:'<path d="M5 7h14l-1 13H6z"/><path d="M9 7V4h6v3M10 11l4 5M14 11l-4 5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', compose:'<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5l3 3L12 15l-4 1 1-4z"/>',
  filter:'<circle cx="12" cy="12" r="9"/><path d="M8 10h8M9.5 13h5M11 16h2"/>', reply:'<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/>',
  replyall:'<path d="M10 7l-5 5 5 5"/><path d="M6 7l-5 5 5 5"/><path d="M5 12h9a6 6 0 0 1 6 6"/>', fwd:'<path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0-6 6"/>',
  move:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6M13 10l3 3-3 3"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>', clip:'<path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>', aa:'<path d="M3 18l5-12 5 12M5 14h6M15 18l3-7 3 7M16 16h4"/>',
  down:'<path d="M7 10l5 5 5-5"/>',
};
const g = (n, s = 18, st = '') => `<svg class="g" viewBox="0 0 24 24" style="width:${s}px;height:${s}px;${st}">${P[n]}</svg>`;
const tl = (x0) => `<i class="tl" style="left:${x0}px;background:#ff5f57"></i><i class="tl" style="left:${x0 + 23}px;background:#febc2e"></i><i class="tl" style="left:${x0 + 46}px;background:#28c840"></i>`;
function sidebar(){
  const r = (i, n, c = '', sel = false, sub = false) => `<div class="row${sel ? ' sel' : ''}${sub ? ' sub' : ''}">${g(i)}<span>${n}</span><span class="n">${c}</span></div>`;
  return `<div class="panel">${tl(19)}<div class="rows">
    <div class="hd">Favourites</div>${r('inbox','All Inboxes','3',true)}${r('flag','Flagged','2')}${r('draft','Drafts','1')}${r('sent','Sent')}
    <div class="hd">Google</div>${r('inbox','Inbox','2')}${r('draft','Drafts')}${r('sent','Sent')}${r('junk','Junk','5')}${r('trash','Bin')}${r('archive','Archive')}${r('folder','Receipts','',false,true)}
    <div class="hd">iCloud</div>${r('inbox','Inbox','1')}${r('sent','Sent')}${r('junk','Junk')}${r('trash','Bin')}</div></div>`;
}
function toolbar(){
  return `<div class="capb" style="left:228px"><b>${g('filter')}</b></div><div class="capb" style="left:524px"><b>${g('compose')}</b></div>
    <div class="capb" style="left:584px"><b>${g('archive')}</b><i class="div"></i><b>${g('trash')}</b><i class="div"></i><b>${g('junk')}</b></div>
    <div class="capb" style="left:712px"><b>${g('reply')}</b><i class="div"></i><b>${g('replyall')}</b><i class="div"></i><b>${g('fwd')}</b></div>
    <div class="capb" style="left:840px"><b>${g('flag')}</b><i class="div"></i><b>${g('move')}</b></div>
    <div class="capb" style="right:9px"><b>${g('search')}</b></div>`;
}
const msgs = [
  [1,'Anna Kim','09:41','Lunch on Friday?','Café Lulo at 12:30 works for me. I booked the table by the window — tell me if Sam is coming too so I can change it.',1,0,0],
  [1,'Lulo OS Beta','08:12','Your build 0.9.0-beta.2 is ready','Release notes, known limitations and how to report a bug. Calendar and Mail are new in this build.',0,0,0],
  [0,'Sam Ortiz','Yesterday','Re: Calendar sync spec','I left comments on the reminder agent section — the timerfd idea is good, but we need to handle resume from suspend.',0,3,1],
  [0,'Northwind Air','Yesterday','Your trip to Lisbon','Booking reference QX7L2P. Flight NW 482 departs 19 October at 07:10. Check in opens 24 hours before.',0,0,1],
  [1,'Grandma','Thursday','Photos from Sunday','Here are the pictures from lunch. The cake one is my favourite!',0,0,1],
  [0,'Bank of Example','Wednesday','Your statement is available','Your October statement is now available to view in online banking.',0,0,0],
  [0,'Climbing Wall','Tuesday','Membership renewal','Your membership renews on 1 November. No action is needed if your card details are unchanged.',0,0,0],
  [0,'Ana Ruiz','Monday','Weekend plans','Are we still on for the farmers market on Saturday? I can bring the big basket.',0,0,0],
];
function list(sel){
  let h = `<div class="list"><div class="lh"><b>All Inboxes</b><div>1,204 messages, 3 unread</div></div>`;
  msgs.forEach(([u, who, d, s, pv, att, thread, flag], i) => {
    h += `<div class="m${u ? ' unread' : ''}${i === sel ? ' sel' : ''}">${u ? '<i class="dot"></i>' : ''}${flag ? g('flag', 12, 'position:absolute;left:8px;top:32px;color:#FF9F0A') : ''}
      <div class="top"><span class="s">${who}</span>${thread ? `<span class="cnt">${thread}</span>` : ''}<span class="d">${d}</span></div>
      <div class="sub">${s}${att ? g('clip', 12, 'color:var(--sec);margin-left:auto') : ''}</div><div class="pv">${pv}</div></div>`;
  });
  return h + '</div>';
}
function viewer(){
  return `<div class="viewer"><div class="vh"><div class="av">AK</div><div><div class="who">Anna Kim</div><div class="meta">To: Jacob Samas &nbsp;·&nbsp; Cc: Sam Ortiz</div><div class="subj">Lunch on Friday?</div></div><div class="date">Today at 09:41</div></div>
    <div class="remote">${g('photo', 15)} This message contains remote content.<span>Load Remote Content</span></div>
    <div class="body"><p>Hi Jacob,</p><p>Café Lulo at 12:30 works for me. I booked the table by the window — tell me if Sam is coming too so I can change it.</p>
    <p>I attached the menu in case you want to pre-order.</p><p>Anna</p>
    <blockquote>On 2 Oct 2026, at 18:05, Jacob Samas wrote:<br>Shall we do lunch on Friday? Anywhere near the office is fine.</blockquote>
    <div class="att"><div><i></i><span>Menu.pdf<small>212 KB</small></span></div></div></div></div>`;
}
function compose(theme){
  return `<div class="cwin ${theme}">${tl(19)}<div class="ttl">Re: Lunch on Friday?</div>
    <div class="capb send" style="right:178px"><b>${g('sent')}</b></div>
    <div class="capb" style="right:9px"><b>${g('clip')}</b><i class="div"></i><b>${g('aa')}</b><i class="div"></i><b>${g('photo')}</b><i class="div"></i><b>${g('down')}</b></div>
    <div class="f" style="top:52px"><span class="k">To:</span><span class="tok">Anna Kim</span></div>
    <div class="f" style="top:86px"><span class="k">Cc:</span><span class="tok">Sam Ortiz</span></div>
    <div class="f" style="top:120px"><span class="k">Subject:</span><span style="color:var(--strong)">Re: Lunch on Friday?</span></div>
    <div class="f" style="top:154px"><span class="k">From:</span><span style="color:var(--strong)">Jacob Samas – jacob@example.com</span><span class="pop">Signature: Work ${g('down', 12)}</span></div>
    <div class="cbody"><p style="margin:0 0 12px">Perfect, see you there. Sam is coming.</p><p style="margin:0 0 12px;color:var(--sec)">--<br>Jacob Samas<br>Lulo OS</p>
    <blockquote style="margin:0;padding-left:10px;box-shadow:inset 2px 0 0 var(--quote);color:var(--sec)">On 3 Oct 2026, at 09:41, Anna Kim wrote:<br><br>Café Lulo at 12:30 works for me…</blockquote></div></div>`;
}
const main = theme => `<div class="win ${theme}">${sidebar()}${toolbar()}${list(0)}${viewer()}</div>`;
document.getElementById('stage').innerHTML =
  `<div><p class="cap-label">Viewer — dark, All Inboxes, conversation threads on</p>${main('dark')}</div>
   <div><p class="cap-label">Viewer — light</p>${main('light')}</div>
   <div><p class="cap-label">Compose (reply) — dark and light</p><div class="pair">${compose('dark')}${compose('light')}</div></div>`;
</script>
</body>
</html>
