[package]
name = "rmac-accounts-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
rmac-accounts.workspace = true
rmac-portal.workspace = true
url.workspace = true
sha2.workspace = true
serde_json.workspace = true
ureq.workspace = true
rustls.workspace = true
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
libc.workspace = true

# Windows: Lulo's own account store (Credential Manager for secrets) in
# place of GNOME Online Accounts; see `winstore`.
[target.'cfg(windows)'.dependencies]
getrandom.workspace = true
rmac-storage.workspace = true
serde.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
] }
