# UEFI PCs get grub-efi-amd64 in place of the image's grub-pc, from a .deb in
# the image, so the install works offline (ADR 0031). The signed shim and
# GRUB are already installed.
---
dontChroot: false
timeout: 900
firmwareType:
    bios: "-/bin/true"
    "*":
        - command: "/usr/libexec/lulo-installer/install-uefi-grub"
          timeout: 900
