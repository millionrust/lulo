# Build and test the Lulo OS bootable USB image (ADR 0031):
# lulo-os-<version>-amd64.iso, a live session plus the Calamares installer,
# made from the Ubuntu 26.04 archive and one GitHub Release's Lulo packages.
#
# - Manual dispatch builds from the newest release (or `release_tag`) and,
#   with `publish`, attaches the tested ISO to that release.
# - After every successful tagged Release run, it builds, tests and attaches
#   the ISO to that release automatically.
#
# Tests boot the ISO in QEMU/KVM: the live session with OVMF Secure Boot and
# with SeaBIOS, and a full Calamares install followed by a boot of the
# installed disk to the Lulo session. Screenshots are artifacts only.
name: Lulo OS ISO

on:
  # Agent branches that change the image (.claude/ci-branch.sh push ... lulo-iso*):
  # workflow_dispatch only works once this file is on the default branch.
  push:
    branches: ["agent/lulo-iso*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release whose packages go on the image (empty: the newest release)"
        type: string
        default: ""
      publish:
        description: "Attach the tested ISO to that release"
        type: boolean
        default: false
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lulo-os-iso-${{ github.event.workflow_run.head_branch || inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  # GitHub's per-asset limit for release files.
  ISO_LIMIT_BYTES: "2147483648"

jobs:
  resolve:
    name: Choose the release
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Pick the release tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            tag=$RUN_TAG; publish=true
          else
            tag=$INPUT_TAG; publish=${INPUT_PUBLISH:-false}
            if [ -z "$tag" ]; then
              tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            fi
          fi
          case "$tag" in v[0-9]*) ;; *) echo "not a release tag: $tag" >&2; exit 1 ;; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building the Lulo OS image from $tag (publish: $publish)"

  build:
    name: Build the ISO
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            debootstrap squashfs-tools xorriso mtools dosfstools \
            librsvg2-bin python3-pil gh
          df -h / /mnt

      - name: Download and verify the release's Lulo packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          cd "$RUNNER_TEMP/debs"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS \
            -p 'rmac-apps_*_amd64.deb' -p 'rmac-session_*_amd64.deb' \
            -p 'niri_*_amd64.deb' -p 'xwayland-satellite_*_amd64.deb'
          for package in rmac-apps rmac-session niri xwayland-satellite; do
            count=$(ls ${package}_*_amd64.deb | wc -l)
            [ "$count" -eq 1 ] || { echo "expected one $package package, found $count" >&2; exit 1; }
          done
          for deb in *.deb; do
            awk -v name="$deb" '$NF == name' SHA256SUMS | sha256sum -c -
            gh attestation verify "$deb" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          rm SHA256SUMS
          ls -l

      - name: Build the image
        run: |
          set -euo pipefail
          work=/mnt/lulo-iso
          if [ "$(df --output=avail -B1G /mnt | tail -n 1)" -lt 30 ]; then work=$RUNNER_TEMP/lulo-iso; fi
          sudo packaging/lulo-os-iso/build-iso.sh --version "$VERSION" \
            --debs "$RUNNER_TEMP/debs" --out "$RUNNER_TEMP/iso" --work "$work"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/iso"

      - name: Check the size limit
        run: |
          set -euo pipefail
          iso="$RUNNER_TEMP/iso/lulo-os-$VERSION-amd64.iso"
          size=$(stat -c %s "$iso")
          echo "ISO size: $size bytes ($((size / 1048576)) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -lt "$ISO_LIMIT_BYTES" ] || { echo "the ISO is over GitHub's 2 GiB release-asset limit" >&2; exit 1; }

      - name: Upload the ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lulo-os-iso
          path: ${{ runner.temp }}/iso/
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

  test:
    name: Boot test (${{ matrix.name }})
    needs: [resolve, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live-uefi-secureboot
            mode: live
            firmware: uefi-sb
            display: virgl
          - name: live-bios
            mode: live
            firmware: bios
            display: virgl
          - name: install-uefi-secureboot
            mode: install
            firmware: uefi-sb
            display: virgl
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF and OCR
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-system-gui qemu-system-modules-opengl qemu-utils ovmf \
            xvfb x11-utils imagemagick libgl1-mesa-dri libegl-mesa0 libegl1 libgl1 libgles2 \
            tesseract-ocr tesseract-ocr-eng python3-pil
          # QEMU's SDL display runs on Xvfb; Mesa's llvmpipe backs the
          # guest's virgl GPU (niri needs an accelerated renderer).
          Xvfb :99 -screen 0 1920x1200x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # KVM for the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-os-iso
          path: ${{ runner.temp }}/iso

      - name: Verify the checksum
        working-directory: ${{ runner.temp }}/iso
        run: sha256sum -c "lulo-os-$VERSION-amd64.iso.sha256"

      - name: Boot the ISO (${{ matrix.mode }}, ${{ matrix.firmware }})
        run: |
          /usr/bin/python3 scripts/iso/qemu_iso_test.py --mode "${{ matrix.mode }}" \
            --firmware "${{ matrix.firmware }}" --display "${{ matrix.display }}" \
            --iso "$RUNNER_TEMP/iso/lulo-os-$VERSION-amd64.iso" \
            --disk "$RUNNER_TEMP/disk.qcow2" --vars "$RUNNER_TEMP/OVMF_VARS.fd" \
            --out "$RUNNER_TEMP/results/${{ matrix.mode }}"

      - name: Boot the installed system
        if: matrix.mode == 'install'
        run: |
          qemu-img info "$RUNNER_TEMP/disk.qcow2"
          /usr/bin/python3 scripts/iso/qemu_iso_test.py --mode installed \
            --firmware "${{ matrix.firmware }}" --display "${{ matrix.display }}" \
            --disk "$RUNNER_TEMP/disk.qcow2" --vars "$RUNNER_TEMP/OVMF_VARS.fd" \
            --out "$RUNNER_TEMP/results/installed"

      - name: Upload screenshots and serial logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-test-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/results/**/*.png
            ${{ runner.temp }}/results/**/*.log
            ${{ runner.temp }}/results/**/*.txt
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Attach the ISO to the release
    needs: [resolve, build, test]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Download the ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lulo-os-iso
          path: iso

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: iso
        run: |
          set -euo pipefail
          sha256sum -c "lulo-os-$VERSION-amd64.iso.sha256"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "lulo-os-$VERSION-amd64.iso" "lulo-os-$VERSION-amd64.iso.sha256"
