[package]
name = "rmac-finder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rmac-files"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
async-io.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rmac-app-launch.workspace = true
rmac-apps.workspace = true
rmac-archive.workspace = true
rmac-appearance.workspace = true
rmac-locale.workspace = true
rmac-mounts.workspace = true
rmac-quick-look.workspace = true
rmac-ui.workspace = true
rmac-search.workspace = true
rmac-storage.workspace = true
rmac-sound.workspace = true
rmac-thumbnails.workspace = true
chrono.workspace = true
libc.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
trash.workspace = true
notify.workspace = true
rustix.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }
