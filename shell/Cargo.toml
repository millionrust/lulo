[workspace]
resolver = "2"
members = ["crates/*", "bins/*", "probes/*"]

[workspace.package]
version = "0.9.0-beta.1"
edition = "2021"
rust-version = "1.95.0"
publish = false
license = "MIT"

[workspace.dependencies]
# GPUI is pinned to 76c93968da5b8b8809bdd72e4ad9e7d0e946bad0 by Cargo.lock,
# the same way as the application workspace, so both can share the patched
# gpui_linux in compat/ (docs/decisions/0013-gpui-linux-patch.md).
async-channel = "2"
async-io = "2"
blocking = "1"
chrono = "0.4"
futures-util = "0.3"
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed.git", package = "gpui" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed.git", package = "gpui_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false }
libc = "=0.2.186"
rmac-apps = { version = "=0.9.0-beta.1", path = "../crates/rmac-apps" }
rmac-app-launch = { version = "=0.9.0-beta.1", path = "../crates/rmac-app-launch" }
rmac-app-menu = { version = "=0.9.0-beta.1", path = "../crates/rmac-app-menu" }
rmac-appearance = { version = "=0.9.0-beta.1", path = "../crates/rmac-appearance" }
rmac-appearance-portal = { version = "=0.9.0-beta.1", path = "../crates/rmac-appearance-portal" }
rmac-archive = { version = "=0.9.0-beta.1", path = "../crates/rmac-archive" }
rmac-compositor = { version = "=0.9.0-beta.1", path = "../crates/rmac-compositor" }
rmac-compositor-niri = { version = "=0.9.0-beta.1", path = "../crates/rmac-compositor-niri" }
rmac-design = { version = "=0.9.0-beta.1", path = "../crates/rmac-design" }
rmac-desktop = { version = "=0.9.0-beta.1", path = "../crates/rmac-desktop" }
rmac-desktop-widgets = { version = "=0.9.0-beta.1", path = "../crates/rmac-desktop-widgets" }
rmac-dock = { version = "=0.9.0-beta.1", path = "../crates/rmac-dock" }
rmac-dock-runtime = { version = "=0.9.0-beta.1", path = "../crates/rmac-dock-runtime" }
rmac-dock-system = { version = "=0.9.0-beta.1", path = "../crates/rmac-dock-system" }
rmac-finder = { version = "=0.9.0-beta.1", path = "../crates/finder" }
rmac-network = { version = "=0.9.0-beta.1", path = "../crates/rmac-network" }
rmac-places = { version = "=0.9.0-beta.1", path = "../crates/rmac-places" }
rmac-places-system = { version = "=0.9.0-beta.1", path = "../crates/rmac-places-system" }
rmac-power = { version = "=0.9.0-beta.1", path = "../crates/rmac-power" }
rmac-quick-look = { version = "=0.9.0-beta.1", path = "../crates/rmac-quick-look" }
rmac-recent-documents = { version = "=0.9.0-beta.1", path = "../crates/rmac-recent-documents" }
rmac-process = { version = "=0.9.0-beta.1", path = "../crates/rmac-process" }
rmac-screen-reader = { version = "=0.9.0-beta.1", path = "../crates/rmac-screen-reader" }
rmac-search = { version = "=0.9.0-beta.1", path = "../crates/rmac-search" }
rmac-storage = { version = "=0.9.0-beta.1", path = "../crates/rmac-storage" }
rmac-osd = { version = "=0.9.0-beta.1", path = "../crates/rmac-osd" }
rmac-login-items-linux = { version = "=0.9.0-beta.1", path = "../crates/rmac-login-items-linux" }
rmac-shell-layer = { version = "=0.9.0-beta.1", path = "crates/rmac-shell-layer" }
rmac-shell-runtime = { version = "=0.9.0-beta.1", path = "../crates/rmac-shell-runtime" }
rmac-shell-settings = { version = "=0.9.0-beta.1", path = "../crates/rmac-shell-settings" }
rmac-shell-status = { version = "=0.9.0-beta.1", path = "../crates/rmac-shell-status" }
rmac-shortcuts = { version = "=0.9.0-beta.1", path = "../crates/rmac-shortcuts" }
rmac-sound = { version = "=0.9.0-beta.1", path = "../crates/rmac-sound" }
rmac-shell-ui = { version = "=0.9.0-beta.1", path = "crates/rmac-shell-ui" }
rmac-theme = { version = "=0.9.0-beta.1", path = "../crates/rmac-theme" }
rmac-wallpaper = { version = "=0.9.0-beta.1", path = "../crates/rmac-wallpaper" }
rmac-wallpaper-image = { version = "=0.9.0-beta.1", path = "../crates/rmac-wallpaper-image" }
rmac-wallpaper-runtime = { version = "=0.9.0-beta.1", path = "../crates/rmac-wallpaper-runtime" }
# The library alone; the Weather app's window stack stays out of the shell.
rmac-weather = { version = "=0.9.0-beta.1", path = "../crates/weather", default-features = false }
trash = "5"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v5"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Optimised but quick to relink, for trying changes on the reference PC:
# `cargo build --profile iterate`. Release keeps fat LTO for shipping.
zbus = { version = "5.16.0", features = ["blocking-api"] }
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[patch."https://github.com/zed-industries/zed.git"]
ztracing = { path = "compat/ztracing" }
gpui_linux = { path = "compat/gpui_linux" }
