# UEFI: Ubuntu's grub-install puts the signed shim and GRUB in
# \EFI\ubuntu (Canonical's signed GRUB looks for its configuration there).
# shellprocess@lulo_finish adds the shim as the removable-media fallback;
# Calamares' own fallback would copy GRUB alone, which Secure Boot rejects.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
installEFIFallback: false
