[package]
name = "rmac-bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Exposes `FakeBluetoothService` and the shared contract assertions in
# `contract` for other crates' tests, without a live D-Bus session.
test-support = []

[dependencies]
async-channel.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io.workspace = true
futures-util.workspace = true
rmac-dbus.workspace = true
zbus.workspace = true

# WinRT Bluetooth (Windows.Devices.Bluetooth, Enumeration and Radios) for
# the Windows backend in src/win.rs.
[target.'cfg(windows)'.dependencies]
futures-util.workspace = true
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Win32_System_WinRT",
] }
