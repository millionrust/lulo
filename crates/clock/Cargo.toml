[package]
name = "rmac-clock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmac-clock"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
blocking.workspace = true
futures-lite.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image.workspace = true
notify.workspace = true
rmac-sound.workspace = true
rmac-spelling.workspace = true
rmac-storage.workspace = true
rmac-ui.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# No /usr/share/zoneinfo to read on Windows (ADR 0023 phase 2): chrono-tz's
# embedded IANA data, and chrono::Local for the OS's own zone, back the
# world clock and alarm scheduling instead. Both are already workspace
# dependencies (calendar, calendar-agent), so this adds no new crate.
[target.'cfg(windows)'.dependencies]
chrono.workspace = true
chrono-tz.workspace = true
