[package]
name = "rmac-search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
libc.workspace = true
quick-xml.workspace = true
rmac-recent-documents.workspace = true
url.workspace = true
walkdir.workspace = true

# Extended attributes hold Files' colour tags on Linux.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Spotlight's file names from the Windows Search index (`windows_index`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Foundation", "Storage", "Storage_Search"] }
