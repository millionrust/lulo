[package]
name = "rmac-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmac-preview"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
blocking.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lopdf = { version = "0.45", default-features = false }
raw-window-handle.workspace = true
rmac-portal.workspace = true
rmac-print-linux.workspace = true
rmac-recent-documents.workspace = true
rmac-spelling.workspace = true
rmac-storage.workspace = true
rmac-ui.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
trash.workspace = true

# Real PDF rendering on Windows (poppler-utils has no Windows package):
# Windows.Data.Pdf through WinRT (ADR 0023 phase 2c).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Win32_System_WinRT",
] }
