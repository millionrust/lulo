<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- rmac typography (FEEL_SPEC.md §D.5). Inter is the system sans; render it
       with grayscale antialiasing and hinting off so it reads like SF rather
       than a hinted Linux UI font. Original rmac policy, not an Apple asset. -->

  <!-- Grayscale antialiasing, no hinting, no subpixel filtering. -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcdnone</const>
    </edit>
  </match>

  <!-- Alias the platform sans names third-party apps ask for to Inter. -->
  <match target="pattern">
    <test name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Helvetica Neue</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SF Pro Text</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SF Pro Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
