[package]
name = "rmac-shell-menubar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The menu bar view is a library shared by Lulo OS's `top-bar` binary and
# the Windows shell (`rmac-win-shell`); ADR 0023, "Phase 3 revised: shared
# shell views".
[lib]
path = "src/lib.rs"

[[bin]]
name = "top-bar"
path = "src/main.rs"

[features]
default = []
wayland = ["gpui_platform/wayland", "rmac-shell-layer/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
async-channel.workspace = true
async-io.workspace = true
blocking.workspace = true
chrono.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
rmac-apps.workspace = true
rmac-app-launch.workspace = true
rmac-app-menu.workspace = true
rmac-audio.workspace = true
rmac-bluetooth.workspace = true
rmac-compositor.workspace = true
rmac-compositor-system.workspace = true
rmac-locale.workspace = true
rmac-network.workspace = true
rmac-power.workspace = true
rmac-quick-settings-system.workspace = true
rmac-recent-documents.workspace = true
rmac-search.workspace = true
rmac-shell-layer.workspace = true
rmac-shell-runtime.workspace = true
rmac-shell-status.workspace = true
rmac-shell-ui.workspace = true
rmac-updates.workspace = true
rmac-ui.workspace = true
uuid.workspace = true

# Lulo OS only: the session's notification server, the shortcut dispatch
# sockets, and what the `top-bar` binary has always linked.
[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true
rmac-compositor-niri.workspace = true
rmac-desktop.workspace = true
rmac-dock.workspace = true
rmac-dock-runtime.workspace = true
rmac-dock-system.workspace = true
rmac-osd.workspace = true
rmac-places.workspace = true
rmac-shell-settings.workspace = true
rmac-shortcuts.workspace = true
rmac-wallpaper.workspace = true
rmac-wallpaper-image.workspace = true
rmac-wallpaper-runtime.workspace = true
trash.workspace = true
zbus.workspace = true
