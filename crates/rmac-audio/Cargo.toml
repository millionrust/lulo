[package]
name = "rmac-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Exposes `FakeAudioService`, the `AudioService` seam, and the shared
# contract assertions in `contract` for other crates' tests.
test-support = []

[dependencies]
async-channel.workspace = true
rmac-process.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io.workspace = true
async-process.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
notify.workspace = true
rustix.workspace = true
serde_json.workspace = true

# Core Audio on Windows (win.rs): endpoints, volume and the change
# notifications. `#[implement]`/`#[interface]` name `windows_core` directly.
[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
